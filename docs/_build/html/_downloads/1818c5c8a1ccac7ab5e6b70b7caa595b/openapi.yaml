  /api/v1/repos/{repoID}/contributors/top:
    get:
      operationId: repositoryTopContributors
      summary: Returns a repository's contributors ranked by commits, issues, pull requests, reviews and comments.
      description: |
        Events (labels, assignments, closes) do not count here. The window
        defaults to the last two years. The envelope echoes the window in
        effect: `until` is the exclusive upper bound (the day after the
        requested `until`), or `0001-01-01T00:00:00Z` when none was given.

        Handler: `handleTopContributors`.
      tags: [Contributors]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - name: limit
          in: query
          required: false
          description: Rows to return; values that are not positive integers mean the default, larger values are capped at 100.
          schema:
            type: integer
            default: 20
        - name: bots
          in: query
          required: false
          description: '`hide` leaves out automation accounts (bot account types, `[bot]` and `…bot` logins, the curated system accounts). Any other value shows them.'
          schema:
            type: string
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        "200":
          description: The ranking.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Aveloxis-Added-To-Group:
              $ref: '#/components/headers/AddedToGroup'
          content:
            application/json:
              schema:
                type: object
                required: [since, until, limit, contributors]
                properties:
                  since:
                    type: string
                    format: date-time
                  until:
                    type: string
                    format: date-time
                  limit:
                    type: integer
                  contributors:
                    type: array
                    items:
                      $ref: '#/components/schemas/TopContributor'
        "304":
          $ref: '#/components/responses/NotModified'
        "400":
          description: An id that is not a positive integer, a date that does not parse, or `since` not before `until`.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "404":
          $ref: '#/components/responses/RepoNotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}/contributors/elsewhere:
    get:
      operationId: repositoryContributorsElsewhere
      summary: Returns the other repositories where a repository's top contributors are active.
      description: |
        For the top contributors (same ranking as
        `repositoryTopContributors`), up to ten other repositories each from
