# Run Go tests on every push to any branch.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      # The cost tests skip under the race detector (it slows both input
      # sizes alike and their large inputs took minutes there), so they run
      # here without it. scripts/cost_tests_scheduled_test.go requires every
      # test that skips on raceBuild (referenced only in an if condition
      # directly inside the test) to be selected by this step.
      - name: Run cost tests (no race detector)
        run: go test -count=1 -run 'CostIsLinear|LookupsAreLogarithmic' ./internal/db/ ./internal/spdx/

      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
