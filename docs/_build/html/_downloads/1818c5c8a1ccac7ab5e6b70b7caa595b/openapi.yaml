  /api/v1/admin/api-tokens:
    get:
      operationId: apiTokens
      summary: Returns every granted API token, newest first, with the grant defaults.
      description: |
        Never carries a token or its hash: only the hash is stored.

        Handler: `handleAdminAPITokens`.
      tags: [Admin API tokens]
      security: [{sessionToken: [admin]}]
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens, settings]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIToken'
                  settings:
                    $ref: '#/components/schemas/APITokenSettings'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: grantAPIToken
      summary: Grants an API token to an account.
      description: |
        The answer is the only time the token is shown; it is sent
        `Cache-Control: private, no-store`. A token's allowances are fixed
        when it is granted. Body limit 64 KiB.

        Handler: `handleAdminAPITokenGrant`.
      tags: [Admin API tokens]
      security: [{sessionToken: [admin]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, label]
              properties:
                user_id:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  description: The account the token authenticates as. A value above 2,147,483,647 is not refused as a `400`; it currently fails as a `500`.
                label:
                  type: string
                  maxLength: 200
                  description: Who or what the token is for. Not blank; at most 200 characters after trimming.
                lifetime_days:
                  type: integer
                  minimum: 1
                  maximum: 365
                  description: Default `default_lifetime_days`.
                rate_limit_per_hour:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  description: Default `default_rate_limit_per_hour`.
                rate_limit_per_day:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  description: Default `default_rate_limit_per_day`.
      responses:
        "201":
          description: Granted.
          headers:
            Cache-Control:
              description: '`private, no-store`.'
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                type: object
                required: [token, token_id, user_id, label, created_at, expires_at, rate_limit_per_hour, rate_limit_per_day]
                properties:
                  token:
                    type: string
                    description: The API token (`avx_…`). Shown once.
                  token_id:
                    type: integer
                    format: int64
                  user_id:
                    type: integer
                  label:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  expires_at:
                    type: string
                    format: date-time
                  rate_limit_per_hour:
                    type: integer
                  rate_limit_per_day:
                    type: integer
        "400":
          description: The body is not JSON; `user_id` is missing, not positive, above 2147483647 (0.29.100; it was a 500), or names no account; `label` is blank or too long; or a lifetime or allowance is out of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/api-tokens/{tokenID}/revoke:
    post:
      operationId: revokeAPIToken
      summary: Revokes an API token.
      description: |
        The token stops working on its next call to any api process (every
        API-token call rechecks it). Revoking a revoked token is a no-op.

        Handler: `handleAdminAPITokenRevoke`.
      tags: [Admin API tokens]
      security: [{sessionToken: [admin]}]
      parameters:
        - name: tokenID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                required: [token_id, revoked]
                properties:
                  token_id:
                    type: integer
                    format: int64
                  revoked:
                    type: boolean
                    const: true
        "400":
          description: The id is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: No API token with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/api-token-settings:
    get:
      operationId: apiTokenSettings
      summary: Returns the defaults an API-token grant offers.
      description: |
        Handler: `handleAdminAPITokenSettings`.
      tags: [Admin API tokens]
      security: [{sessionToken: [admin]}]
      responses:
        "200":
          description: The defaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenSettings'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: updateAPITokenSettings
      summary: Changes the defaults an API-token grant offers.
      description: |
        The allowances are the `token_requests_per_hour` and
        `token_requests_per_day` quotas. Changing the value of one that
        `aveloxis.json` sets is refused with `409`; sending its current value
        (or omitting the daily one) is accepted. An omitted daily value is
        left unchanged.
        Tokens already granted keep their allowances. Body limit 64 KiB.

        Handler: `handleAdminAPITokenSettingsUpdate`.
      tags: [Admin API tokens]
      security: [{sessionToken: [admin]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [default_rate_limit_per_hour, default_lifetime_days]
              properties:
                default_rate_limit_per_hour:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                default_rate_limit_per_day:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                default_lifetime_days:
                  type: integer
                  minimum: 1
                  maximum: 365
      responses:
        "200":
          description: The defaults as saved.
          content:
            application/json:
              schema:
                type: object
                required: [default_rate_limit_per_hour, default_rate_limit_per_day, default_lifetime_days]
                properties:
                  default_rate_limit_per_hour:
                    type: integer
                  default_rate_limit_per_day:
                    type: integer
                  default_lifetime_days:
                    type: integer
        "400":
          description: The body is not JSON, or a value is missing or out of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          description: '`aveloxis.json` sets an allowance quota whose value the request changes; change it there.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/capacity:
    get:
      operationId: capacityOverview
      summary: Returns every quota as applied, the refusal contact, sign-ups, the sign-up allowlist, overridden accounts and today's busiest accounts.
      description: |
        `quotas` lists every quota in name order. `signups_per_day` covers
        the last 30 UTC days (`null` when there were none).
        `busiest_today` holds at most 25 accounts, by saved session
        requests.

        Handler: `handleAdminCapacity`.
      tags: [Admin capacity]
      security: [{sessionToken: [admin]}]
      responses:
        "200":
          description: The capacity overview.
          content:
            application/json:
              schema:
                type: object
                required: [quotas, contact_email, signups_per_day, signup_allowlist, overrides, busiest_today]
                properties:
                  quotas:
                    type: array
                    items:
                      $ref: '#/components/schemas/EffectiveQuota'
                  contact_email:
                    type: string
                    description: The address refusals name; empty when none is offered.
                  signups_per_day:
                    type: array
                    items:
                      $ref: '#/components/schemas/SignupDay'
                  signup_allowlist:
                    type: array
                    items:
                      $ref: '#/components/schemas/SignupAllowlistEntry'
                  overrides:
                    type: array
                    items:
                      $ref: '#/components/schemas/CapacityAccount'
                  busiest_today:
                    type: array
                    maxItems: 25
                    items:
                      $ref: '#/components/schemas/CapacityAccount'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/capacity/largest:
    get:
      operationId: largestAccounts
      summary: Returns the accounts with the most repositories in their groups.
      description: |
        At most 25 accounts. Cost: reads every group link, so the page asks
        for it only on demand.

        Handler: `handleAdminCapacityLargest`.
      tags: [Admin capacity]
      security: [{sessionToken: [admin]}]
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    maxItems: 25
                    items:
                      $ref: '#/components/schemas/CapacityAccount'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/capacity/quotas/{name}:
    post:
      operationId: setCapacityQuota
      summary: Sets one quota's value and mode.
      description: |
        The api processes apply it within a minute. Body limit 64 KiB.
        `shared_with_me_adds_per_hour` is fixed and is not a quota here.

        Handler: `handleAdminCapacityQuota`.
      tags: [Admin capacity]
      security: [{sessionToken: [admin]}]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum:
              - repo_links_per_day
              - repos_per_account
              - requests_per_day
              - requests_per_hour
              - signups_per_address_per_day
              - token_requests_per_day
              - token_requests_per_hour
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allowed, mode]
              properties:
                allowed:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                mode:
                  $ref: '#/components/schemas/QuotaMode'
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [name, allowed, mode]
                properties:
                  name:
                    type: string
                  allowed:
                    type: integer
                  mode:
                    $ref: '#/components/schemas/QuotaMode'
        "400":
          description: The body is not JSON, `allowed` is missing or out of range, or `mode` is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: No quota with that name (checked after the body parses).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: '`aveloxis.json` sets this quota (`DEFAULT`, `SHADOW` or `OFF`); change it there.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/capacity/contact:
    post:
      operationId: setCapacityContact
      summary: Sets the address every refusal invites heavy users to write to.
      description: |
        An empty value offers none. Body limit 64 KiB.

        Handler: `handleAdminCapacityContact`.
      tags: [Admin capacity]
      security: [{sessionToken: [admin]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contact_email:
                  type: string
                  default: ""
                  description: An e-mail address, or empty to offer none. Omitted reads as empty, so `{}` clears the address.
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [saved]
                properties:
                  saved:
                    type: boolean
                    const: true
        "400":
          description: The body is not a JSON object, `contact_email` is missing (0.29.100; a body without it cleared the address), or it is neither empty nor an e-mail address within the length limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/capacity/accounts:
    get:
      operationId: capacityAccount
      summary: Returns one account's capacity figures, found by user id or login.
      description: |
        `user_id` wins when both are given. A login matches regardless of
        letter case; when more than one account has it, the answer is `409`
        with the candidates to choose from by `user_id`.

        Handler: `handleAdminCapacityAccount`.
      tags: [Admin capacity]
      security: [{sessionToken: [admin]}]
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: login
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityAccount'
        "400":
          description: '`user_id` is not a positive integer in range.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: No such account (also for a missing or empty `login`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: More than one account has this login apart from letter case. Never stored.
          content:
            application/json:
              schema:
                type: object
                required: [error, candidates]
                properties:
                  error:
                    type: string
                  candidates:
                    type: array
                    items:
                      type: object
                      required: [user_id, login, provider, gitlab_host]
                      properties:
                        user_id:
                          type: integer
                        login:
                          type: string
                        provider:
                          type: string
                        gitlab_host:
                          type: string
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/capacity/accounts/{userID}:
    post:
      operationId: setCapacityOverride
      summary: Sets one account's own quota values.
      description: |
        `null` (or an omitted field) takes the quota's value; all `null` and
        no note removes the override. That removal does not check the
        account: for an id with no account it answers `200` `{"saved":
        true}` and changes nothing. Body limit 64 KiB.

        Handler: `handleAdminCapacityOverride`.
      tags: [Admin capacity]
      security: [{sessionToken: [admin]}]
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repos_allowed:
                  type: [integer, "null"]
                  minimum: 1
                  maximum: 2147483647
                requests_per_hour:
                  type: [integer, "null"]
                  minimum: 1
                  maximum: 2147483647
                requests_per_day:
                  type: [integer, "null"]
                  minimum: 1
                  maximum: 2147483647
                links_per_day:
                  type: [integer, "null"]
                  minimum: 1
                  maximum: 2147483647
                note:
                  type: string
                  maxLength: 500
                  description: At most 500 characters; blank when only spaces.
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, saved]
                properties:
                  user_id:
                    type: integer
                  saved:
                    type: boolean
                    const: true
        "400":
          description: The id is not a positive integer in range, the body is not JSON, a value is not between 1 and 2,147,483,647, or the note is over 500 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: No account with that user id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/capacity/signup-allowlist:
    post:
      operationId: addSignupAllowlistNetwork
      summary: Exempts a network from the sign-up quota.
      description: |
        For an organization whose members sign up from one address. The
        network is stored normalised and the answer echoes that form. Body
        limit 64 KiB.

        Handler: `handleAdminSignupAllowlistAdd`.
      tags: [Admin capacity]
      security: [{sessionToken: [admin]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cidr]
              properties:
                cidr:
                  type: string
                  examples: [192.0.2.0/24]
                note:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required: [cidr]
                properties:
                  cidr:
                    type: string
                    description: The network as stored.
        "400":
          description: The body is not JSON, `cidr` is not a network in CIDR form, or the note is too long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/capacity/signup-allowlist/remove:
    post:
      operationId: removeSignupAllowlistNetwork
      summary: Removes a network from the sign-up allowlist.
      description: |
        Body limit 64 KiB.

        Handler: `handleAdminSignupAllowlistRemove`.
      tags: [Admin capacity]
      security: [{sessionToken: [admin]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cidr]
              properties:
                cidr:
                  type: string
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: boolean
                    const: true
        "400":
          description: The body is not JSON, or `cidr` is not a network in CIDR form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: That network is not on the allowlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me:
    get:
      operationId: me
      summary: Returns the caller's identity, account e-mail, role, scope size and fair-use numbers.
      description: |
        The identity fields and the account fields are best-effort: a failed
        lookup yields empty strings (logged), never an error. `capacity` is
        `null` when the store cannot answer. For an API token, `capacity`
        reports the token's own allowances.

        Handler: `handleMe`.
      tags: [Account]
      security: [{sessionToken: []}, {apiToken: []}]
      responses:
        "200":
          description: The caller. Sent `private, no-store`.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, login, name, avatar_url, provider, email, email_pending, is_admin, capacity, scope_repo_count]
                properties:
                  user_id:
                    type: integer
                  login:
                    type: string
                  name:
                    type: string
                  avatar_url:
                    type: string
                  provider:
                    type: string
                    description: The forge of the account's last sign-in (`github`, `gitlab`); empty when unknown.
                  email:
                    type: string
                    description: The confirmed account e-mail; empty when none.
                  email_pending:
                    type: string
                    description: An address waiting for its confirmation link; empty when none.
                  is_admin:
                    type: boolean
                    description: Always `false` for an API token.
                  capacity:
                    oneOf:
                      - $ref: '#/components/schemas/MeCapacity'
                      - type: "null"
                  scope_repo_count:
                    type: integer
                    description: How many repositories the caller may read; `-1` for an administrator's session (unscoped).
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me/sessions:
    get:
      operationId: mySessions
      summary: Returns the caller's live sessions.
      description: |
        Every live session of the account (0.29.113, OWASP ASVS V7.5.2): the
        browser sessions of the web GUI (`kind` `web`), the tokens
        `POST /api/v1/auth/token` minted and the tokens the web process's
        `/api/` proxy holds (`kind` `api`; both are minted from a browser
        session: `from_web_session` is `true` while that session lives and
        `false` once it has expired, which the SPA's 30-day token outlives).
        The session presenting
        this request is `current`. Operator-issued API tokens are not
        sessions and are not listed. A browser session idle past
        `web.session_idle_minutes` is not live and not listed.
        `last_used_at` moves, at most once a minute (every half bound when the bound is under two minutes), for `kind` `web` only;
        a token's is its mint time.

        Handler: `handleMeSessions`.
      tags: [Account]
      security: [{sessionToken: []}]
      responses:
        "200":
          description: The sessions, newest first.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSession'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me/sessions/revoke:
    post:
      operationId: revokeMySessions
      summary: Ends every session of the caller's account, this one included.
      description: |
        Deletes the account's web sessions, `/auth/token` tokens and proxy
        tokens (0.29.113, OWASP ASVS V7.5.2): every other browser and client
        of the account is signed out at its next request, and this token's
        next request is `401` too — the answer is the last one it gets. No
        body. Never refused by a spent request quota, and not counted
        (0.29.114), like sign-out.

        Handler: `handleMeSessionsRevoke`.
      tags: [Account]
      security: [{sessionToken: []}]
      responses:
        "200":
          description: Done; `ended` counts the sessions and tokens deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsEnded'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/me/email:
    post:
      operationId: submitAccountEmail
      summary: Stores an address as the account's pending e-mail and mails its confirmation link.
      description: |
        The same submission the web process's account page uses. A refusal the
        user can act on (not a deliverable address, mail not configured on
        this server, a failed save or send) is a `422` carrying the message
        the web form shows. Bodies over 4 KiB are refused.

        Handler: `handleMeEmail`.
      tags: [Account]
      security: [{sessionToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: The confirmation link was mailed.
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent:
                    type: boolean
                    const: true
        "400":
          description: 'The body is not the JSON object `{"email": "…"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: |
            An operator-issued API token (`error` is a sentence saying an
            API token cannot change account settings), or a sign-in older
            than `web.session_idle_minutes` (since 0.29.113, OWASP ASVS
            V7.5.1: `error` is `reauthentication_required` and `message`
            says what to do — the recovery address changes only after a
            recent sign-in; every session token is judged by the sign-in of
            the browser session it was minted from, and a token whose
            browser session expired has none that counts).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: Nothing was mailed; `message` says why, in the words the web form uses.
          content:
            application/json:
              schema:
                type: object
                required: [sent, message]
                properties:
                  sent:
                    type: boolean
                    const: false
                  message:
                    type: string
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          description: |
            A presented token could not be checked (`session lookup failed;
            try again`), or this server runs without a store (`accounts
            unavailable`), or the request ran past `http_timeout_seconds`
            (plain text).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/email/confirm:
    post:
      operationId: confirmAccountEmail
      summary: Confirms the account's pending e-mail with the token from the mailed link.
      description: |
        The token must be live for the signed-in account. A token that is
        unknown, expired, already used or another account's answers `200`
        with `status` `invalid` and changes nothing. A database failure is a
        `500` with `status` `error`; the link still works. `token` is not
        required: a body without it (`{}`) is read as an empty token and
        answers `200` with `status` `invalid`, like any other unknown token.

        Handler: `handleMeEmailConfirm`.
      tags: [Account]
      security: [{sessionToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: The token from the confirmation link (surrounding whitespace is ignored).
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [confirmed, invalid]
        "400":
          description: 'The body is not a JSON object.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          description: The database failed; nothing changed and the link still works.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: error
        "503":
          description: |
            A presented token could not be checked, or this server runs
            without a store (`accounts unavailable`), or the request ran past
            `http_timeout_seconds` (plain text).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/logout:
    post:
      operationId: signOut
      summary: Ends the presented session token.
      description: |
        Deletes the Bearer session token server-side. An already-invalid
        session token answers `204` too, unless `api.require_auth` is on,
        where the authentication layer answers `401` first. Another `api`
        process may accept the token for up to its 60-second authorization
        cache. Never refused by a spent session quota and not counted; an
        API token here is counted like any request and answered `400`.

        Handler: `handleLogout`.
      tags: [Account]
      security: [{sessionToken: []}]
      responses:
        "204":
          description: The session token no longer exists.
        "400":
          description: An API token was presented; an administrator revokes those.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/groups:
    get:
      operationId: groups
      summary: Returns the caller's groups.
      description: |
        Every group the account owns, whatever its status; `status` is
        `approved` when the store holds none.

        Handler: `handleGroupsList`.
      tags: [Groups]
      security: [{sessionToken: []}, {apiToken: []}]
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortalGroup'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createGroup
      summary: Creates a group owned by the caller.
      description: |
        Groups are born `approved`; approval applies to each addition, not to
        the group. The name is trimmed and at most 200 characters; the body
        at most 4 KiB.

        Handler: `handleGroupCreate`.
      tags: [Groups]
      security: [{sessionToken: []}, {apiToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "200":
          description: The new group's id.
          content:
            application/json:
              schema:
                type: object
                required: [group_id]
                properties:
                  group_id:
                    type: integer
                    format: int64
        "400":
          description: 'The body is not `{"name": "…"}`, the name is empty, or it is longer than 200 characters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/groups/{groupID}/repos:
    parameters:
      - $ref: '#/components/parameters/GroupID'
    get:
      operationId: groupRepositories
      summary: Returns one page of a group's repositories.
      description: |
        Counts are the collection queue's cached totals. `sort` is checked
        against an allowlist (unknown keys fall back to `name`), and the
        envelope echoes the sort and direction actually applied. An
        administrator may read any group.

        Handler: `handleGroupRepos`.
      tags: [Groups]
      security: [{sessionToken: []}, {apiToken: []}]
      parameters:
        - name: page
          in: query
          description: 1-based page; values below 1 read as 1.
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: Rows per page; values below 1 read as 50, values above 100 as 100.
          schema:
            type: integer
            default: 50
        - name: sort
          in: query
          description: Sort key from the collection-listing allowlist; anything else sorts by `name`.
          schema:
            type: string
            default: name
        - name: dir
          in: query
          description: '`desc` (any case) for descending; anything else is ascending.'
          schema:
            type: string
            default: asc
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                type: object
                required: [repos, total, page, page_size, sort, dir]
                properties:
                  repos:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortalGroupRepo'
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
                  sort:
                    type: string
                    description: The sort key applied.
                  dir:
                    type: string
                    description: '`asc` or `desc`: the direction applied (0.29.100; a `DESC` sent is echoed as `desc`).'
        "400":
          description: The group id is not an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: No group of the caller's has that id (`no group of yours with that id`); an administrator's session reads any group, an API token only its owner's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: addRepositoriesToGroup
      summary: Adds repositories, or one organization, to one of the caller's groups.
      description: |
        `kind` `repo` (the default) adds `urls` (or the single `url`, used
        only when `urls` holds no non-empty entry): at most 1,000 per request,
        all in one step. Repositories already tracked are linked at once
        (`linked`); an administrator's new repositories are queued for
        collection (`enqueued`); a non-administrator's new ones wait for
        approval as one add request (`pending_approval`, `request_id`),
        unless they fit under `web.auto_approve_add_limit`.

        `kind` `org` registers one organization (one URL per request). An
        administrator's registration, or one of an organization already
        tracked elsewhere, answers `registered: 1`; otherwise the
        registration waits for approval (`pending_approval: 1`,
        `request_id`). The organization's repositories are linked later, by
        the scheduler's organization scan. A GitHub organization must be on
        this deployment's GitHub host, and a GitLab group on its configured
        GitLab instance (`gitlab.base_url`).

        Every line is parsed as a repository URL first (a missing scheme
        is supplied; GitHub, GitLab and any git host are accepted): a line
        that is not one is reported in `invalid` and skipped, the rest go
        through; a paste with no usable line is a `400`.

        An add that does not fit the account's repository allocation (`403`)
        or its daily additions (`429`, quota `repo_links_per_day`, until
        00:00 UTC) adds nothing and is refused with the `capacity_limit`
        body. A group that is not the caller's is a `404`; one an
        administrator rejected is a `409`. A `500` naming how many
        `repositories could not be added` means some URLs failed while the
        others were added: send them again. The body is bounded (1,000 URLs
        at the store's URL length).

        Handler: `handleGroupAddRepo`.
      tags: [Groups]
      security: [{sessionToken: []}, {apiToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: One URL; ignored when `urls` holds a non-empty entry.
                urls:
                  type: array
                  maxItems: 1000
                  description: Repository URLs (blank entries are skipped). Organizations take exactly one.
                  items:
                    type: string
                kind:
                  type: string
                  enum: [repo, org]
                  default: repo
                  description: Any value other than `org` adds repositories.
      responses:
        "200":
          description: |
            What happened. For repositories: `linked`, `enqueued`, and when
            approval is needed `pending_approval` and `request_id`. For an
            organization: `registered: 1`, or `pending_approval: 1` with
            `request_id`.
          content:
            application/json:
              schema:
                type: object
                required: [ok, submitted]
                properties:
                  ok:
                    type: boolean
                    const: true
                  submitted:
                    type: integer
                    description: The non-blank URLs received.
                  linked:
                    type: integer
                    description: Repositories only. Already-tracked repositories linked into the group.
                  enqueued:
                    type: integer
                    description: Repositories only. New repositories queued for collection.
                  pending_approval:
                    type: integer
                    description: Items waiting for an administrator (an organization counts 1).
                  request_id:
                    type: integer
                    format: int64
                    description: The add request holding the waiting items.
                  invalid:
                    type: array
                    description: 'Repositories only. Lines that were not repository URLs, each "url: why" (credentials redacted); they were skipped.'
                    items:
                      type: string
                  registered:
                    type: integer
                    const: 1
                    description: Organizations only. Tracking is registered now.
        "400":
          description: |
            The body is malformed or names no URL; no line of the paste is a
            repository URL; more than 1,000 URLs; more than one organization;
            a group id that is not an integer; an organization not on this
            deployment's GitHub host or GitLab instance; a URL that is too long, carries
            credentials or was refused by the database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The add would exceed the account's repository allocation (`capacity_limit`, `kind` `allocation`). Nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityRefusal'
        "404":
          description: No group of the caller's has that id (`no group of yours with that id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: An administrator rejected the group; it takes no additions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          description: |
            JSON `error` `add request <id>: <f> of <n> repositories could not
            be added; try adding them again` (`f` of the `n` URLs failed, the
            rest were added), or the generic server failure as plain text
            (`internal error; try again`; the cause is in the api log).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema:
                type: string
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/groups/{groupID}/orgs:
    get:
      operationId: groupOrganizations
      summary: Returns the organizations tracked in a group.
      description: |
        Read-only; registration is `POST /api/v1/groups/{groupID}/repos` with
        `kind` `org`. An administrator may read any group.

        Handler: `handleGroupOrgs`.
      tags: [Groups]
      security: [{sessionToken: []}, {apiToken: []}]
