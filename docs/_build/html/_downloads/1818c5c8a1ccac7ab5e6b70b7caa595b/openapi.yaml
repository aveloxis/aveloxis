        repositories outside its owner's groups are left out; repositories
        not collected here stay. Answers are cached for 60 seconds.

        Handler: `handleContributorsElsewhere`.
      tags: [Contributors]
      security: [{sessionToken: []}, {apiToken: []}, {}]
