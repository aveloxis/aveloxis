# SPDX-License-Identifier: MIT
#
# The Aveloxis REST API contract: the single source for the reference
# pages (docs/api/reference.rst renders it). scripts/openapi_routes_test.go
# compares it with the routes internal/api registers, both ways, and with
# the access each handler enforces. The naming and design rules are
# docs/api/conventions.md.
openapi: 3.1.0
info:
  title: Aveloxis REST API
  version: v1
  summary: Collected open source community health data, over HTTP and JSON.
  description: |
    The API served by `aveloxis api` (default address `127.0.0.1:8383`,
    setting `api.addr`). Every path is under `/api/v1`. Bodies are JSON
    unless an operation says otherwise; refusals written by the HTTP
    library (`400`, the per-address `429`, `500`) are `text/plain`.
    The conventions every operation follows (access, scope, rate limits,
    caching, errors) are on the Conventions page of the documentation.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8383
    description: An `aveloxis api` process on its default address.

tags:
  - name: Service
    description: Liveness and the anonymous fleet figures.
  - name: Repositories
    description: One collected repository's statistics, series, licenses, SBOMs, scan results and traffic.
  - name: Vulnerabilities
    description: Vulnerability findings and the OpenSSF Scorecard.
  - name: Contributors
    description: Who contributes to a repository, and where else they are active.
  - name: Comparison
    description: The metric catalog and the comparison of up to seven repositories or organizations.
  - name: Supply chain
    description: Package-centred view of dependencies and advisories across repositories.
  - name: Account
    description: The signed-in caller's identity, account e-mail and session.
  - name: Home
    description: The caller's home lists.
  - name: Groups
    description: The caller's groups of repositories and organizations.
  - name: Collections
    description: Administrator-curated groups of groups, readable by every signed-in caller.
  - name: Admin users and groups
    description: Account roles and group approvals. Administrator sessions only.
  - name: Admin add requests
    description: Repository and organization additions waiting for approval. Administrator sessions only.
  - name: Admin monitor
    description: The collection queue and its statistics. Administrator sessions only.
  - name: Admin collections
    description: Creating and changing collections. Administrator sessions only.
  - name: Admin API tokens
    description: Operator-issued API tokens and their defaults. Administrator sessions only.
  - name: Admin capacity
    description: The fair-use quotas and per-account overrides. Administrator sessions only.
  - name: Admin forge-ID changes
    description: Repositories deleted and re-created upstream under the same URL. Administrator sessions only.
  - name: Augur catalog
    description: Augur-compatible lookups of repositories and repository groups (for 8Knot and other Augur clients).
  - name: Augur metrics
    description: Augur-compatible per-repository metrics, with Augur's parameter names (`begin_date`, `end_date`, `period`).

paths:
  /api/v1/health:
    get:
      operationId: health
      summary: Returns the server's status and version.
      description: |
        The liveness probe. It reads nothing from the database.

        Handler: `handleHealth`.
      tags: [Service]
      security: []
      responses:
        "200":
          description: The process is serving.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/public/stats:
    get:
      operationId: publicFleetStats
      summary: Returns the fleet's repository, commit, issue, pull-request and contributor totals.
      description: |
        The landing page's anonymous figures. Served from a 60-second cache
        that keeps the last good values when a reload fails.

        Handler: `handlePublicStats`.
      tags: [Service]
      security: []
      responses:
        "200":
          description: The totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFleetStats'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          description: |
            `stats unavailable` (text) when the first load since the process
            started failed and no earlier values exist; or a presented token
            could not be checked (JSON, `session lookup failed; try again`);
            or the request ran past `http_timeout_seconds` (text, `request
            exceeded http_timeout_seconds`).
          content:
            text/plain:
              schema:
                type: string
                description: '`stats unavailable`, or `request exceeded http_timeout_seconds`, with a newline.'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/mailing-list/stats:
    get:
      operationId: mailingListStats
      summary: Returns the mailing-list collection coverage rollup.
      description: |
        The same figures as `aveloxis mailing-list-stats`. The keys are
        PascalCase.

        Cost: counts over the mailing-list tables on every call (not cached).

        Handler: `handleMailingListStats`.
      tags: [Service]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      responses:
        "200":
          description: The rollup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailingListStats'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}/stats:
    get:
      operationId: repositoryStats
      summary: Returns a repository's gathered and forge-reported counts, vulnerability counts and status.
      description: |
        Gathered counts are the collection queue's cached totals; metadata
        counts come from the latest forge snapshot. An id with no repository
        answers zeros to an unscoped caller (a scoped caller gets the `403`).

        Handler: `handleRepoStats`.
      tags: [Repositories]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - $ref: '#/components/parameters/RepoID'
      responses:
        "200":
          description: The repository's statistics.
          headers:
            X-Aveloxis-Added-To-Group:
              $ref: '#/components/headers/AddedToGroup'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoStats'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "404":
          $ref: '#/components/responses/RepoNotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/stats:
    get:
      operationId: repositoryStatsBatch
      summary: Returns the statistics of several repositories, keyed by id.
      description: |
        `ids` is a comma-separated list of repository ids; an entry that is
        not a positive integer is a `400` (since 0.29.99; it was skipped
        before). At most 500 ids per request. A caller that is not an
        administrator's session (an API token, or any other signed-in session)
        gets only the ids in its groups; the others are left out, and an
        answer with none of them is `{}`. An id no repository has is left
        out too (since 0.29.99; it was a row of zeros). Repositories no
        longer in the collection queue fall back to live counts.

        Handler: `handleRepoStatsBatch`.
      tags: [Repositories]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated repository ids, at most 500.
          schema:
            type: string
            examples: ["1,2,3,42"]
      responses:
        "200":
          description: Statistics per repository id (object keys are the ids as strings).
          content:
            application/json:
              schema:
                type: object
                propertyNames:
                  title: repo_id
                  pattern: '^[0-9]+$'
                additionalProperties:
                  $ref: '#/components/schemas/RepoStats'
        "400":
          description: '`ids` missing, an entry that is not a positive integer, or more than 500 ids.'
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}/sbom:
    get:
      operationId: repositorySBOM
      summary: Returns a software bill of materials for a repository as a JSON download.
      description: |
        Generated from the stored dependency data: CycloneDX 1.7 (default)
        or SPDX 2.3. Repositories with lockfile data carry the real
        dependency graph. The `Content-Disposition` filename is
        `sbom-repo-<id>[-runtime][-with-vulns].cdx.json` or `.spdx.json`.

        Cost: generated per request when not in the response cache.

        Handler: `handleSBOMDownload`.
      tags: [Repositories]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [cyclonedx, spdx]
            default: cyclonedx
        - name: scope
          in: query
          required: false
          description: '`runtime` keeps only runtime-scope components (unclassified count as runtime).'
          schema:
            type: string
            enum: [all, runtime]
            default: all
        - name: vulns
          in: query
          required: false
          description: '`1` annotates the document with the repository''s current findings (CycloneDX `vulnerabilities`; SPDX package `externalRefs` of category SECURITY). Any other value is ignored.'
          schema:
            type: string
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        "200":
          description: The SBOM document.
          headers:
            Content-Disposition:
              description: '`attachment; filename="…"`.'
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Aveloxis-Added-To-Group:
              $ref: '#/components/headers/AddedToGroup'
          content:
            application/json:
              schema:
                type: object
                description: A CycloneDX 1.7 or SPDX 2.3 JSON document, as published by those standards.
                additionalProperties: true
        "304":
          $ref: '#/components/responses/NotModified'
        "400":
          description: An id that is not a positive integer, or `format` / `scope` outside their values.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "404":
          description: '`repo not found` (an unscoped caller asked for an id with no repository).'
          content:
            text/plain:
              schema:
                type: string
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}/timeseries:
    get:
      operationId: repositoryTimeSeries
      summary: Returns a repository's weekly commits, pull requests opened and merged, and issues opened.
      description: |
        The window starts two years before today's UTC midnight by default.
        An omitted `until` ends it at the latest plausible commit time, UTC
        midnight two days ahead; a given `until` is inclusive (the window
        ends at the next midnight) and is never later than that bound. The
        start is never earlier than 1970-01-02. The bounds apply to all four
        series, not only commits. Weeks start on Monday (UTC).

        Handler: `handleTimeSeries`.
      tags: [Repositories]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        "200":
          description: The four weekly series.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Aveloxis-Added-To-Group:
              $ref: '#/components/headers/AddedToGroup'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSeriesResult'
        "304":
          $ref: '#/components/responses/NotModified'
        "400":
          description: An id that is not a positive integer, a date that does not parse, or `since` not before `until`.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "404":
          $ref: '#/components/responses/RepoNotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          description: A server-side failure; also an unscoped caller's id with no repository.
          content:
            text/plain:
              schema:
                type: string
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}/licenses:
    get:
      operationId: repositoryLicenses
      summary: Returns a repository's dependency licenses with counts and OSI approval.
      description: |
        One row per canonical SPDX expression. `scanned` is false until
        dependency analysis has run for the repository (or when that probe
        failed; such an answer is not cached); `licenses` is `[]` when
        there are no dependencies.

        Handler: `handleLicenses`.
      tags: [Repositories]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - name: scope
          in: query
          required: false
          description: '`runtime` counts only runtime-scope dependencies (unclassified count as runtime).'
          schema:
            type: string
            enum: [all, runtime]
            default: all
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        "200":
          description: The license table.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Aveloxis-Added-To-Group:
              $ref: '#/components/headers/AddedToGroup'
          content:
            application/json:
              schema:
                type: object
                required: [scanned, scope, licenses]
                properties:
                  scanned:
                    type: boolean
                  scope:
                    type: string
                    enum: [all, runtime]
                    description: The scope in effect.
                  licenses:
                    type: array
                    items:
                      $ref: '#/components/schemas/LicenseCount'
        "304":
          $ref: '#/components/responses/NotModified'
        "400":
          description: An id that is not a positive integer, or `scope` outside its values.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "404":
          $ref: '#/components/responses/RepoNotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}/scancode-licenses:
    get:
      operationId: repositoryScancodeLicenses
      summary: Returns the source-file licenses and copyright holders ScanCode found in a repository.
      description: |
        Aggregated from the per-file scan. `last_run` is `""` until ScanCode
        has run for the repository. A part that could not be read is served
        empty (`[]` lists) and the answer is not cached.

        Handler: `handleScancodeLicenses`.
      tags: [Repositories]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        "200":
          description: Licenses, copyrights and freshness.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Aveloxis-Added-To-Group:
              $ref: '#/components/headers/AddedToGroup'
          content:
            application/json:
              schema:
                type: object
                required: [licenses, copyrights, last_run, scancode_version]
                properties:
                  licenses:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScancodeSourceLicense'
                  copyrights:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScancodeSourceCopyright'
                  last_run:
                    type: string
                    description: '`YYYY-MM-DD` (UTC) of the last scan, or `""`.'
                  scancode_version:
                    type: string
        "304":
          $ref: '#/components/responses/NotModified'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "404":
          $ref: '#/components/responses/RepoNotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}/scancode-files:
    get:
      operationId: repositoryScancodeFiles
      summary: Returns ScanCode's per-file license and copyright rows for a repository.
      description: |
        One row per scanned file; `[]` when nothing is stored or the read
        failed (that answer is not cached).

        Handler: `handleScancodeFiles`.
      tags: [Repositories]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        "200":
          description: The file rows.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Aveloxis-Added-To-Group:
              $ref: '#/components/headers/AddedToGroup'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScancodeFileEntry'
        "304":
          $ref: '#/components/responses/NotModified'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "404":
          $ref: '#/components/responses/RepoNotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/search:
    get:
      operationId: repositorySearch
      summary: Returns up to 20 repositories whose name, owner or URL contains the query.
      description: |
        Case-insensitive substring match over every collected repository
        (not limited to the caller's groups), ordered by owner then name.
        `%` and `_` in `q` match themselves (since 0.29.99; they acted as
        SQL wildcards before). `[]` when nothing matches.

        Handler: `handleRepoSearch`.
      tags: [Repositories]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The matches.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/SearchRepoResult'
        "400":
          description: '`q parameter required`.'
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/authz/repos/{repoID}:
    get:
      operationId: repositoryAuthorization
      summary: Answers whether the caller may read the repository; returns no data.
      description: |
        Handler: `handleRepoAuthz`.
      tags: [Repositories]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - $ref: '#/components/parameters/RepoID'
      responses:
        "204":
          description: The caller may read the repository.
          headers:
            X-Aveloxis-Added-To-Group:
              $ref: '#/components/headers/AddedToGroup'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "404":
          $ref: '#/components/responses/RepoNotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}/contributions/identities:
    get:
      operationId: repositoryContributorIdentities
      summary: Returns every distinct person who contributed to a repository in the window.
      description: |
        A contribution is a commit authored, an issue opened or closed, an
        issue or pull-request event, a pull request opened, a review
        submitted, or any comment. Commits whose author was never resolved
        to a contributor are not counted. The window defaults to the last
        two years; ordered by login then full name.

        Handler: `handleRepoContributors`.
      tags: [Contributors]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        "200":
          description: One row per person.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Aveloxis-Added-To-Group:
              $ref: '#/components/headers/AddedToGroup'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepoContributor'
        "304":
          $ref: '#/components/responses/NotModified'
        "400":
          description: An id that is not a positive integer, a date that does not parse, or `since` not before `until`.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "404":
          $ref: '#/components/responses/RepoNotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}/contributions/affiliations:
    get:
      operationId: repositoryContributorAffiliations
      summary: Returns the number of distinct contributors per affiliation in the window.
      description: |
        The same people as `repositoryContributorIdentities` for the same
        window, so the counts sum to its row count. Affiliation comes from
        the curated e-mail-domain map, then the profile company, else
        `(unknown)` (kept, so the sum reconciles). Ordered by count
        descending, then name.

        Handler: `handleRepoAffiliations`.
      tags: [Contributors]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        "200":
          description: One row per affiliation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Aveloxis-Added-To-Group:
              $ref: '#/components/headers/AddedToGroup'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AffiliationCount'
        "304":
          $ref: '#/components/responses/NotModified'
        "400":
          description: An id that is not a positive integer, a date that does not parse, or `since` not before `until`.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "404":
          $ref: '#/components/responses/RepoNotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}/contributions/coverage:
