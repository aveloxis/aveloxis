      summary: "Returns the repository's dependencies with their libyear."
      description: |
        With neither `license` nor `scope`, every stored dependency row, ordered by name. With either, the rows the licenses table aggregates (GitHub Actions rows excluded), so a license bucket counting N lists exactly N rows. An empty result is `[]`.

        Handler: `handleDeps`.
      security:
        - sessionToken: []
        - apiToken: []
        - {}
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - name: license
          in: query
          required: false
          description: |
            Keep only rows whose license normalizes to this canonical bucket, exactly as `/repos/{repoID}/licenses` returned it.
          schema:
            type: string
        - name: scope
          in: query
          required: false
          description: |
            `runtime` keeps only runtime-scope dependencies (dev, test, build, optional and peer rows excluded); `all` keeps every scope. Any other value is a `400`.
          schema:
            type: string
            enum: [all, runtime]
        - $ref: '#/components/parameters/IfNoneMatch'
