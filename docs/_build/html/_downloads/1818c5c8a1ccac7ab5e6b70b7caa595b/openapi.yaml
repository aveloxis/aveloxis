                properties:
                  orgs:
                    type: array
                    items:
                      type: object
                      required: [org_request_id, url, name, platform]
                      properties:
                        org_request_id:
                          type: integer
                          format: int64
                        url:
                          type: string
                        name:
                          type: string
                        platform:
                          type: string
                        last_scanned:
                          type: string
                          format: date-time
                          description: Absent until the organization's first scan.
        "400":
          description: The group id is not an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: No group of the caller's has that id (`no group of yours with that id`); an administrator's session reads any group, an API token only its owner's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/groups/{groupID}/pending-adds:
    get:
      operationId: groupPendingAdditions
      summary: Returns a group's additions waiting for approval.
      description: |
        One row per waiting item (repository URL or organization). An
        administrator may read any group.

        Handler: `handleGroupPendingAdds`.
      tags: [Groups]
      security: [{sessionToken: []}, {apiToken: []}]
      parameters:
        - $ref: '#/components/parameters/GroupID'
      responses:
        "200":
          description: The waiting items.
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending:
                    type: array
                    items:
                      type: object
                      required: [request_id, kind, url, created_at]
                      properties:
                        request_id:
                          type: integer
                          format: int64
                        kind:
                          type: string
                          enum: [repos, org]
                        url:
                          type: string
                        created_at:
                          type: string
                          format: date-time
        "400":
          description: The group id is not an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: No group of the caller's has that id (`no group of yours with that id`); an administrator's session reads any group, an API token only its owner's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/groups/{groupID}/repos/{repoID}/remove:
    post:
      operationId: removeRepositoryFromGroup
      summary: Removes a repository from one of the caller's groups.
      description: |
        How an account makes room under its repository allocation. Removing
        does not give back the day's addition (`repo_links_per_day`), and a
        group that tracks an organization gets that organization's
        repositories linked back by the next scan.

        Handler: `handleGroupRemoveRepo`.
      tags: [Groups]
      security: [{sessionToken: []}, {apiToken: []}]
      parameters:
        - $ref: '#/components/parameters/GroupID'
        - $ref: '#/components/parameters/RepoID'
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [group_id, repo_id, removed]
                properties:
                  group_id:
                    type: integer
                    format: int64
                  repo_id:
                    type: integer
                    format: int64
                  removed:
                    type: boolean
                    const: true
        "400":
          description: An id is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: No group of the caller's has that id (`no group of yours with that id`), or the repository is not in it (`that repository is not in that group`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/users:
    get:
      operationId: users
      summary: Returns every account.
      description: |
        Handler: `handleAdminUsers`.
      tags: [Admin users and groups]
      security: [{sessionToken: [admin]}]
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required: [user_id, login, email, provider, is_admin, created_at, last_seen]
                      properties:
                        user_id:
                          type: integer
                        login:
                          type: string
                        email:
                          type: string
                        provider:
                          type: string
                        is_admin:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                        last_seen:
                          type: string
                          format: date-time
                          description: The last sign-in.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/users/{userID}/sessions/revoke:
    post:
      operationId: revokeUserSessions
      summary: Ends every session of an account.
      description: |
        An administrator's answer to a lost device or a suspected account
        takeover (0.29.113, OWASP ASVS V7.4.5): the account's web sessions,
        `/auth/token` tokens and proxy tokens are deleted, and each is `401`
        at its next request. Operator-issued API tokens are not touched
        (revoke those on the API-tokens page). An administrator may end its
        own account's sessions this way. The action is logged. No body.

        Handler: `handleAdminUserSessionsRevoke`.
      tags: [Admin users and groups]
      security: [{sessionToken: [admin]}]
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        "200":
          description: Done; `ended` counts the sessions and tokens deleted (`0` for an account with none, and for an id no account has).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsEnded'
        "400":
          description: The user id is not an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/users/{userID}/admin:
    post:
      operationId: setAdministrator
      summary: Promotes an account to administrator or demotes it.
      description: |
        An administrator cannot demote itself, and the last administrator is
        never demoted. The change applies to the account's next request in
        this process.

        Handler: `handleAdminSetUserAdmin`.
      tags: [Admin users and groups]
      security: [{sessionToken: [admin]}]
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                admin:
                  type: boolean
                  default: false
                  description: Omitted reads as `false`, so `{}` demotes the account.
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        "400":
          description: 'The user id is not an integer, the body is not a JSON object with a boolean `admin` (for example `{"admin": "yes"}`, `{}` — the field is required since 0.29.100 — or no body at all), or the caller tried to demote itself.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: No user with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: The account is the last administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/groups/{groupID}/reject:
    post:
      operationId: rejectGroup
      summary: Rejects a group.
      description: |
        The group-level abuse lever (v0.27.20): a rejected group takes no
        further additions and its organizations stop being listed; its
        repositories stay. Works on any group. The legacy approve arm and
        `GET /admin/groups/pending` are gone since 0.29.100 (groups are born
        approved; the additions queue, `/admin/add-requests`, is the
        approval unit).

        Handler: `handleAdminGroupReject`.
      tags: [Admin users and groups]
      security: [{sessionToken: [admin]}]
      parameters:
        - $ref: '#/components/parameters/GroupID'
      responses:
        "200":
          description: Done (a group already rejected answers the same).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        "400":
          description: The group id is not an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: No group with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/add-requests:
    get:
      operationId: pendingAddRequests
      summary: Returns the additions waiting for approval.
      description: |
        Handler: `handleAdminAddRequests`.
      tags: [Admin add requests]
      security: [{sessionToken: [admin]}]
      responses:
        "200":
          description: The waiting add requests.
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending:
                    type: array
                    items:
                      type: object
                      required: [request_id, user_id, user_login, user_email, group_id, group_name, kind, item_count, created_at]
                      properties:
                        request_id:
                          type: integer
                          format: int64
                        user_id:
                          type: integer
                        user_login:
                          type: string
                        user_email:
                          type: string
                        group_id:
                          type: integer
                          format: int64
                        group_name:
                          type: string
                        kind:
                          type: string
                          enum: [repos, org]
                        org_url:
                          type: string
                          description: Organizations only.
                        item_count:
                          type: integer
                        sample_urls:
                          type: array
                          description: Repository requests only. A sample of the URLs.
                          items:
                            type: string
                        created_at:
                          type: string
                          format: date-time
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/add-requests/{requestID}/{decision}:
    post:
      operationId: decideAddRequest
      summary: Approves or rejects an add request.
      description: |
        An approved repository request is processed in the background
        (repositories created, queued and linked); approving it again resumes
        an interrupted pass. An approved organization request registers
        tracking; the scheduler's next organization scan links its
        repositories. A request already decided keeps its decision: deciding
        it again, in either direction, answers `changed: false` and changes
        nothing, except that approving an approved request again resumes an
        interrupted repository pass, or registers an organization whose
        registration an older release lost (then `changed: true`). The
        requester is mailed when the decision changed.

        Handler: `handleAdminAddRequestDecision`.
      tags: [Admin add requests]
      security: [{sessionToken: [admin]}]
      parameters:
        - name: requestID
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: decision
          in: path
          required: true
          schema:
            type: string
            enum: [approve, reject]
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [ok, changed]
                properties:
                  ok:
                    type: boolean
                    const: true
                  changed:
                    type: boolean
        "400":
          description: The request id is not an integer, or the decision is neither `approve` nor `reject`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: No such add request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: |
            The group was rejected, or an organization cannot be registered
            (not on this deployment's GitHub host or GitLab instance, a URL
            carrying credentials, or too long); the body says what to do.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/monitor/stats:
    get:
      operationId: queueStats
      summary: Returns the collection queue's row counts by status.
      description: |
        Always carries `queued`, `collecting`, `draining` and `total`, plus
        any other status present. `draining` counts rows parked by the
        staging drain or `heal-collection-gaps`; they hold no worker.

        Handler: `handleAdminMonitorStats`.
      tags: [Admin monitor]
      security: [{sessionToken: [admin]}]
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                required: [queue]
                properties:
                  queue:
                    type: object
                    required: [queued, collecting, draining, total]
                    properties:
                      queued:
                        type: integer
                      collecting:
                        type: integer
                      draining:
                        type: integer
                      total:
                        type: integer
                    propertyNames:
                      title: status
                    additionalProperties:
                      type: integer
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/monitor/queue:
    get:
      operationId: queuePage
      summary: Returns one page of 100 collection-queue rows.
      description: |
        Each row carries the queue's cached gathered counts and the latest
        metadata counts. `sort` is checked against an allowlist; an unknown
        key uses the default order (collecting first) and the envelope then
        echoes empty `sort` and `dir`. A row whose repository name cannot be
        read is labelled with its id.

        Handler: `handleAdminMonitorQueue`.
      tags: [Admin monitor]
      security: [{sessionToken: [admin]}]
      parameters:
        - name: page
          in: query
          description: 1-based page; values below 1 read as 1.
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: Rows per page, at most 100 (since 0.29.109; earlier releases always answered 100).
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 100
        - name: q
          in: query
          description: Filter on the repository.
          schema:
            type: string
        - name: sort
          in: query
          description: Sort key from the queue allowlist.
          schema:
            type: string
        - name: dir
          in: query
          description: '`desc` (any case) for descending; anything else is ascending. Ignored when `sort` is not an allowlisted key.'
          schema:
            type: string
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                type: object
                required: [jobs, total, page, page_size, sort, dir]
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      required: [repo_id, repo, status, priority, due_at, issues, prs, commits, meta_issues, meta_prs, meta_commits]
                      properties:
                        repo_id:
                          type: integer
                          format: int64
                        repo:
                          type: string
                          description: '`owner/name`, or the id when the name could not be read.'
                        status:
                          type: string
                        priority:
                          type: integer
                        due_at:
                          type: string
                          format: date-time
                        last_collected:
                          type: string
                          format: date-time
                        last_error:
                          type: string
                        issues:
                          type: integer
                        prs:
                          type: integer
                        commits:
                          type: integer
                        meta_issues:
                          type: integer
                        meta_prs:
                          type: integer
                        meta_commits:
                          type: integer
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer
                    description: The page size applied (the request's, at most 100; 100 when none was given).
                    minimum: 1
                    maximum: 100
                  sort:
                    type: string
                    description: The sort key applied; empty for the default order.
                  dir:
                    type: string
                    enum: ["", asc, desc]
                  warnings:
                    type: array
                    description: |
                      Present only when a batched read behind the page failed (since 0.29.109):
                      "Repository names could not be read; the rows show repository ids." (every
                      `repo` is then the id) and/or "Repository counts could not be read; the counts
                      show 0." The failure is logged on the server.
                    items:
                      type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/monitor/queue/{repoID}/prioritize:
    post:
      operationId: prioritizeRepository
      summary: Moves a repository to the front of the collection queue.
      description: |
        Sets priority 0, due now, and status `queued`.

        Handler: `handleAdminPrioritizeRepo`.
      tags: [Admin monitor]
      security: [{sessionToken: [admin]}]
      parameters:
        - $ref: '#/components/parameters/RepoID'
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [ok, repo_id]
                properties:
                  ok:
                    type: boolean
                    const: true
                  repo_id:
                    type: integer
                    format: int64
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: The repository has no queue row.
          content:
            text/plain:
              schema:
                type: string
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}/star:
    parameters:
      - $ref: '#/components/parameters/RepoID'
    get:
      operationId: repositoryStarState
      summary: Returns whether the caller starred a repository.
      description: |
        Stars are the caller's own; no repository scope applies.

        Handler: `handleRepoStarState`.
      tags: [Repositories]
      security: [{sessionToken: []}, {apiToken: []}]
      responses:
        "200":
          description: The star state.
          content:
            application/json:
              schema:
                type: object
                required: [starred]
                properties:
                  starred:
                    type: boolean
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/RepoNotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          description: The star state could not be read.
          content:
            text/plain:
              schema:
                type: string
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: starRepository
      summary: Stars a repository for the caller.
      description: |
        A signed-in session starring a repository outside its groups adds it
        to its "Starred" group (`added_to_group`), counted against
        `shared_with_me_adds_per_hour` (`429`), the repository allocation
        (`403`) and the daily additions (`429`, quota `repo_links_per_day`).
        An API
        token is refused for such a repository with the instructions to add
        it. Starring again is idempotent.

        Handler: `handleStarRepo`.
      tags: [Repositories]
      security: [{sessionToken: []}, {apiToken: []}]
      responses:
        "200":
          description: Starred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StarResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "404":
          $ref: '#/components/responses/RepoNotFound'
          content:
            text/plain:
              schema:
                type: string
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: unstarRepository
      summary: Removes the caller's star from a repository.
      description: |
        No scope applies; the repository stays in any group the star added
        it to.

        Handler: `handleStarRepo`.
      tags: [Repositories]
      security: [{sessionToken: []}, {apiToken: []}]
      responses:
        "200":
          description: Unstarred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StarResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/RepoNotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/home/repos:
    get:
      operationId: homeRepositories
      summary: Returns the caller's home list, starred repositories first, then the most active of its groups.
      description: |
        Activity is issues and pull requests opened in the last 90 days (the
        queue's cached figure). Cached per caller and `limit` for five
        minutes; an expired answer up to an hour old is served at once
        (`X-Cache: stale`) while one background refresh recomputes it.

        Handler: `handleHomeRepos`.
      tags: [Home]
      security: [{sessionToken: []}, {apiToken: []}]
      parameters:
        - name: limit
          in: query
          description: Rows; values below 1 read as 50, values above 100 as 100.
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: The list. Sent `private, no-store`.
          headers:
            X-Cache:
              description: '`hit` (fresh), `stale` (expired, being refreshed) or `miss` (computed now).'
              schema:
                type: string
                enum: [hit, stale, miss]
          content:
            application/json:
              schema:
                type: object
                required: [repos]
                properties:
                  repos:
                    type: array
                    items:
                      $ref: '#/components/schemas/HomeRepo'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/forge-id-changes:
    get:
      operationId: forgeIDChanges
      summary: Returns the recorded forge-ID changes.
      description: |
        A repository deleted and re-created upstream under the same URL gets
        a new forge ID; the organization scan records it as pending. The full
        list orders adoptable, superseded, then adopted changes. A pending
        change whose old ID is no longer the stored one is `superseded` and
        cannot be adopted.

        Handler: `handleAdminForgeIDChanges`.
      tags: [Admin forge-ID changes]
      security: [{sessionToken: [admin]}]
      parameters:
        - name: pending
          in: query
          description: '`1` lists only the adoptable changes; any other value lists all.'
          schema:
            type: string
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items:
                      $ref: '#/components/schemas/ForgeIDChange'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          description: '`forge-ID changes could not be listed`.'
          content:
            text/plain:
              schema:
                type: string
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/forge-id-changes/{repoID}/adopt:
    post:
      operationId: adoptForgeIDChange
      summary: Adopts a recorded forge-ID change, treating the new upstream repository as a continuation.
      description: |
        Moves the stored forge ID to the one the scan observed and records
        the administrator. The body names the change, since a repository can
        have more than one. The api process holds no forge keys, so this
        adopts the recorded observation; `aveloxis adopt-forge-id` asks the
        forge live. The body is at most 6,256 bytes and the note at most
        1,000 bytes.

        Handler: `handleAdminForgeIDAdopt`.
      tags: [Admin forge-ID changes]
      security: [{sessionToken: [admin]}]
      parameters:
        - $ref: '#/components/parameters/RepoID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_forge_id, new_forge_id]
              properties:
                old_forge_id:
                  type: string
                  minLength: 1
                new_forge_id:
                  type: string
                  minLength: 1
                note:
                  type: string
                  description: At most 1,000 bytes.
      responses:
        "200":
          description: Adopted.
          content:
            application/json:
              schema:
                type: object
                required: [adopted, repo_id]
                properties:
                  adopted:
                    type: boolean
                    const: true
                  repo_id:
                    type: integer
                    format: int64
        "400":
          description: The repository id is not a positive integer, the body is unreadable, too large or not JSON, an ID is missing, or the note is too long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: No unadopted change with that pair is recorded for this repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Superseded; the repository no longer stores the old ID. Nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repo-groups:
    get:
      operationId: augurRepositoryGroups
      tags: ["Augur catalog"]
      summary: "Returns every repository group, ordered by name."
      description: |
        The legacy repository groups (`aveloxis_data.repo_groups`), not the caller's own groups (see Groups). An API token sees only the groups holding at least one repository of its owner's groups (since 0.29.99); every other caller sees every group. An empty result is `[]`.

        Handler: `handleRepoGroups`.
      security:
        - sessionToken: []
        - apiToken: []
        - {}
      responses:
        "200":
          description: "The repository groups."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AugurRepositoryGroup'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos:
    get:
      operationId: augurRepositories
      tags: ["Augur catalog"]
      summary: "Returns every collected repository, ordered by owner and name."
      description: |
        Not paged: one row per repository. An API token sees only the repositories of its owner's groups (since 0.29.99); a session, an administrator and a caller without an identity get the whole catalog. Cost: one scan of the repositories table. An empty result is `[]`.

        Handler: `handleAllRepos`.
      security:
        - sessionToken: []
        - apiToken: []
        - {}
      responses:
        "200":
          description: "The repositories."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AugurRepository'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}:
    get:
      operationId: augurRepository
      tags: ["Augur catalog"]
      summary: "Returns one repository's identity fields."
      description: |
        The body is the internal repository record without JSON tags, so its keys are PascalCase, unlike the other catalog lookups. Only `ID`, `Platform`, `GitURL`, `Name` and `Owner` are read from the database; every other field carries its zero value (`GroupID` 0, empty strings, `false`, `0001-01-01T00:00:00Z`).

        Handler: `handleRepoByID`.
      security:
        - sessionToken: []
        - apiToken: []
        - {}
      parameters:
        - $ref: '#/components/parameters/RepoID'
      responses:
        "200":
          description: "The repository."
          headers:
            X-Aveloxis-Added-To-Group:
              $ref: '#/components/headers/AddedToGroup'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AugurRepositoryRecord'
        "400":
          description: "`repoID` is not a positive integer (`invalid repo_id`)."
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "404":
          description: "No repository has this id (`repo not found`)."
          content:
            text/plain:
              schema:
                type: string
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repo-groups/{groupID}/repos:
    get:
      operationId: augurRepositoryGroupRepositories
      tags: ["Augur catalog"]
      summary: "Returns the repositories of one repository group, ordered by owner and name."
      description: |
        An API token sees only the repositories of its owner's groups (since 0.29.99). A group id no group has, or a group with nothing in the token's scope, answers `200` with `[]` (no `404`). An empty result is `[]`.

        Handler: `handleReposByGroup`.
      security:
        - sessionToken: []
        - apiToken: []
        - {}
      parameters:
        - name: groupID
          in: path
          required: true
          description: A legacy repository group's id (`repo_group_id`).
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "The group's repositories."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AugurRepository'
        "400":
          description: "`groupID` is not an integer (`invalid repo_group_id`)."
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/owner/{owner}/repo/{repo}:
    get:
      operationId: augurRepositoryByOwnerAndName
      tags: ["Augur catalog"]
      summary: "Returns the repository with this owner and name."
      description: |
        Owner and name match without regard to letter case. When the name exists on two forges the GitHub one is picked, then the lower id. An API token is answered within its owner's groups (since 0.29.99): the in-scope repository when one exists; when the name exists only outside its scope, the structured `403` naming that repository; when it exists nowhere, `404`.

        Handler: `handleRepoByOwnerName`.
      security:
        - sessionToken: []
        - apiToken: []
        - {}
      parameters:
        - name: owner
          in: path
