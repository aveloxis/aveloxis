                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: No collection with that id (0.29.100; it was a 500).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: A collection with that name already exists (0.29.100; it was a 500).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/collections/{collectionID}/delete:
    post:
      operationId: deleteCollection
