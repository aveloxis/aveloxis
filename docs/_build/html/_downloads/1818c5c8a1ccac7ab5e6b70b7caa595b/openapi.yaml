        "200":
          description: "The dependency rows."
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Aveloxis-Added-To-Group:
              $ref: '#/components/headers/AddedToGroup'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AugurDependencyRow'
        "304":
          $ref: '#/components/responses/NotModified'
        "400":
          description: "`repoID` is not a positive integer, or `scope` is neither `all` nor `runtime`."
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "404":
          $ref: '#/components/responses/RepoNotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}/libyear:
    get:
      operationId: augurLibyear
      tags: ["Augur metrics"]
      summary: "Returns the repository's dependencies with their libyear, under Augur's libyear name."
      description: |
        The same answer as `deps`. With neither `license` nor `scope`, every stored dependency row, ordered by name. With either, the rows the licenses table aggregates (GitHub Actions rows excluded), so a license bucket counting N lists exactly N rows. An empty result is `[]`.

        Handler: `handleDeps`.
      security:
        - sessionToken: []
        - apiToken: []
        - {}
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - name: license
          in: query
          required: false
          description: |
            Keep only rows whose license normalizes to this canonical bucket, exactly as `/repos/{repoID}/licenses` returned it.
          schema:
            type: string
        - name: scope
          in: query
          required: false
          description: |
            `runtime` keeps only runtime-scope dependencies (dev, test, build, optional and peer rows excluded); `all` keeps every scope. Any other value is a `400`.
          schema:
            type: string
            enum: [all, runtime]
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        "200":
          description: "The dependency rows."
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Aveloxis-Added-To-Group:
              $ref: '#/components/headers/AddedToGroup'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AugurDependencyRow'
        "304":
          $ref: '#/components/responses/NotModified'
        "400":
          description: "`repoID` is not a positive integer, or `scope` is neither `all` nor `runtime`."
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "404":
          $ref: '#/components/responses/RepoNotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}/repo-messages:
    get:
      operationId: augurRepositoryMessages
      tags: ["Augur metrics"]
      summary: "Returns the messages posted per period."
      description: |
        Every stored message of the repository (issue, pull request and review comments) counted by its timestamp. The window is `begin_date` through `end_date`, both inclusive UTC days (since 0.29.99; before, `end_date` ended at that day's midnight), by default the year before today through today. A date that does not parse as `YYYY-MM-DD` is a `400`. `period` buckets by `day`, `week`, `month` or `year`; it defaults to `month`, and any other value is read as `month` (no `400`). An empty result is `[]`.

        Handler: `handleRepoMessages`.
      security:
        - sessionToken: []
        - apiToken: []
        - {}
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - $ref: '#/components/parameters/BeginDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/Period'
      responses:
        "200":
          description: "One row per bucket that has activity, oldest first."
          headers:
            X-Aveloxis-Added-To-Group:
              $ref: '#/components/headers/AddedToGroup'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AugurMetricRow'
        "400":
          description: "`repoID` is not a positive integer (`invalid repo_id`)."
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "404":
          $ref: '#/components/responses/RepoNotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}/releases:
    get:
      operationId: augurReleases
      tags: ["Augur metrics"]
      summary: "Returns the repository's releases, newest first."
      description: |
        Ordered by publication time, unpublished last. An empty result is `[]`.

        Handler: `handleReleases`.
      security:
        - sessionToken: []
