# Run Go tests on every push to any branch.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      # -timeout 20m (0.29.224): Go's default is 10 minutes a package. On
      # this two-core runner under -race with coverage, on 0.29.219,
      # internal/manifest took 545 and 552 s and internal/db 516 and 526 s
      # (the two runs of this job); internal/manifest then timed out at
      # 600 s on 0.29.222 (TestBuildFileReadersScaleLinearly alone had run
      # 5m45s), and internal/db, internal/manifest and internal/collector
      # had each timed out on earlier commits of the same branch. The
      # value is the one scripts/skip-census.sh passes, for the same reason.
      - name: Run tests
        run: go test -race -timeout 20m -coverprofile=coverage.out ./...

      # The cost tests skip under the race detector (it slows both input
      # sizes alike and their large inputs took minutes there), so they run
      # here without it. scripts/cost_tests_scheduled_test.go requires every
      # test that skips on raceBuild (referenced only in an if condition
      # directly inside the test) to be selected by this step.
      - name: Run cost tests (no race detector)
        run: go test -count=1 -run 'CostIsLinear|LookupsAreLogarithmic|^TestCheck(SeparatesLinear|PassesAllocating)|^TestLinearReportsAFailure$' ./internal/db/ ./internal/spdx/ ./internal/costtest/

      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
