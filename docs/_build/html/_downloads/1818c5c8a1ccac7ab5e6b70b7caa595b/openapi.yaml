            format: uuid
        - name: months
          in: query
          required: false
          description: Months of history; values that are not positive integers mean the default, larger values are capped at 60.
          schema:
            type: integer
            default: 24
        - name: bucket
          in: query
          required: false
          description: Only `month` is accepted (reserved for other granularities).
          schema:
            type: string
            const: month
      responses:
        "200":
          description: The activity view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributorActivityView'
