components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: opaque session token
      description: |
        A signed-in session, minted by the web process's `/auth/token`
        after an OAuth sign-in and valid for 30 days. Sent as
        `Authorization: Bearer <token>`. An administrator's session is
        unscoped; any other session reads the repositories in its
        account's groups. The `admin` role marks the operations that
        require an administrator's session.
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: avx_ prefixed API token
      description: |
        An operator-issued API token (`avx_…`), granted by an administrator
        to an existing account. It reads as its owner, scoped to the owner's
        groups even when the owner is an administrator, and never
        administers or changes account settings. It is counted against its
        own hourly and daily allowances instead of the per-address limit.

  parameters:
    RepoID:
      name: repoID
      in: path
      required: true
      description: A repository's id (`repo_id`). A value that is not a positive integer is a `400`; an id no repository has is a `404` on every repository route (since 0.29.99).
      schema:
        type: integer
        format: int64
    GroupID:
      name: groupID
      in: path
      required: true
      description: A group's id.
      schema:
        type: integer
        format: int64
    CollectionID:
      name: collectionID
      in: path
      required: true
      description: A collection's id.
      schema:
        type: integer
        format: int64
    UserID:
      name: userID
      in: path
      required: true
      description: An account's id.
      schema:
        type: integer
    Since:
      name: since
      in: query
      required: false
      description: |
        First UTC day of the window (`YYYY-MM-DD`, inclusive). A value that
        does not parse is a `400` (since 0.29.99; it fell back to the
        default before).
      schema:
        type: string
        format: date
    Until:
      name: until
      in: query
      required: false
      description: |
        Last UTC day of the window (`YYYY-MM-DD`, inclusive: the whole day
        counts). A value that does not parse is a `400` (since 0.29.99). A
        window whose `since` is not before `until` is a `400`.
      schema:
        type: string
        format: date
    BeginDate:
      name: begin_date
      in: query
      required: false
      description: Augur's window start, an inclusive UTC day (`YYYY-MM-DD`). Default a year before today; a value that does not parse is a `400` (since 0.29.99).
      schema:
        type: string
        format: date
    EndDate:
      name: end_date
      in: query
      required: false
      description: Augur's window end, an inclusive UTC day (`YYYY-MM-DD`; the whole day counts, since 0.29.99). Default today; a value that does not parse is a `400`.
      schema:
        type: string
        format: date
    Period:
      name: period
      in: query
      required: false
      description: Augur's bucket size, `day`, `week`, `month` or `year`. Any other value is read as `month`, never refused.
      schema:
        type: string
        default: month
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: An `ETag` from an earlier answer. When it names the current one the answer is `304` with no body.
      schema:
        type: string

  headers:
    ETag:
      description: |
        The answer's validator, weak (`W/"…"`) when the answer depends only
        on the repository's stored state. Send it back as `If-None-Match`.
      schema:
        type: string
    CacheControl:
      description: |
        `no-cache` for an answer any caller may be given (revalidate each
        time); `private, no-store` for an answer about this caller, which
        nothing may store.
      schema:
        type: string
        enum: ["no-cache", "private, no-store"]
    XCache:
      description: '`hit` when the answer came from the server''s response cache; absent otherwise.'
      schema:
        type: string
        const: hit
    AddedToGroup:
      description: |
        Present once, on the answer whose request added the repository to
        the caller's "Shared with Me" group (a signed-in session following a
        link to a repository outside its groups). Its value is the group's
        name. The addition happens before the operation runs, so the header
        rides on whatever that request answers, a `400`, `404`, `429` or
        `500` included; the reference declares it on the success response.
      schema:
        type: string
        const: Shared with Me
    RetryAfter:
      description: Whole seconds until the refused request may succeed (at least 1).
      schema:
        type: integer
        minimum: 1
    RateLimit:
      description: |
        The tightest enforced quota this answer was counted against (IETF
        RateLimit header fields draft): `"<quota>";r=<remaining>;t=<seconds
        to reset>`. Sent on every answer counted against an enforced quota
        of a session or an API token; a quota in shadow mode is not
        advertised.
      schema:
        type: string
        examples: ['"token_requests_per_hour";r=998;t=3412']
    RateLimitPolicy:
      description: 'Every enforced quota the answer was counted against: `"<quota>";q=<allowed>;w=<window seconds>`, comma-separated.'
      schema:
        type: string
        examples: ['"token_requests_per_hour";q=1000;w=3600, "token_requests_per_day";q=10000;w=86400']
    XRateLimitLimit:
      description: The tightest enforced quota's allowance (the older header, kept for clients that read it).
      schema:
        type: integer
    XRateLimitRemaining:
      description: Requests left in the tightest enforced quota's window.
      schema:
        type: integer
    XRateLimitReset:
      description: When the tightest enforced quota's window ends, in Unix seconds.
      schema:
        type: integer
        format: int64

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          description: The running binary's version.
          examples: ["0.29.90"]
    PublicFleetStats:
      type: object
      required: [repos, commits, issues, prs, contributors]
      properties:
        repos:
          type: integer
          format: int64
          description: Every repository in the catalog, archived ones included.
        commits:
          type: integer
          format: int64
          description: Sum of the collection queue's cached gathered commit totals.
        issues:
          type: integer
          format: int64
        prs:
          type: integer
          format: int64
        contributors:
          type: integer
          format: int64
          description: The contributor catalog's row count.
    MailingListStats:
      type: object
      description: The mailing-list rollup. Its keys are PascalCase (the Go struct carries no JSON tags).
      required: [Lists, ScanComplete, EmailMessages, Mirrors, SignaledCaptured, SignaledResolved, SenderTotal, SenderResolved, ByClass]
      properties:
        Lists:
          type: integer
          description: Registered lists.
        ScanComplete:
          type: integer
          description: Lists that finished their current scan.
        EmailMessages:
          type: integer
          format: int64
        Mirrors:
          type: integer
          format: int64
        SignaledCaptured:
          type: integer
          format: int64
          description: Messages that named a repository.
        SignaledResolved:
          type: integer
          format: int64
          description: Of those, the ones resolved to a collected repository.
        SenderTotal:
          type: integer
          format: int64
        SenderResolved:
          type: integer
          format: int64
        ByClass:
          type: [object, "null"]
          description: Message count per `msg_class`; `null` when no message is classified.
          propertyNames:
            title: msg_class
          additionalProperties:
            type: integer
            format: int64
    RepoStats:
      type: object
      required: [repo_id, gathered_prs, gathered_issues, gathered_commits, metadata_prs, metadata_issues, metadata_commits, vulnerabilities, critical_vulns, vulnerabilities_version_unknown]
      properties:
        repo_id:
          type: integer
          format: int64
        gathered_prs:
          type: integer
          description: Pull requests collected, from the collection queue's cached totals as of the last completed collection.
        gathered_issues:
          type: integer
        gathered_commits:
          type: integer
        metadata_prs:
          type: integer
          description: The forge's reported total from the latest metadata snapshot.
        metadata_issues:
          type: integer
        metadata_commits:
          type: integer
        vulnerabilities:
          type: integer
          description: Current findings (unresolved, not the repository's own package, version known).
        critical_vulns:
          type: integer
          description: Current findings with severity CRITICAL or a CVSS score of at least 9.0.
        vulnerabilities_version_unknown:
          type: integer
          description: Findings matched against an unpinned version.
        archived:
          type: boolean
          description: Single-repository answer only. The forge reports the repository as archived (read-only). The batch answer (`/repos/stats`) does not read it and always says `false`.
        last_activity_at:
          type: string
          format: date-time
          description: Single-repository answer only. The latest observed activity; absent when unknown (and always absent in the batch answer).
        forked_from:
          type: string
          description: 'Single-repository answer only (always absent in the batch answer). The upstream `owner/name` of a fork; `(unknown upstream)` when the forge reports a fork but not its upstream; absent otherwise.'
        last_collected:
          type: string
          format: date-time
        gone_at:
          type: string
          format: date-time
          description: When the forge stopped serving the repository; absent while it is served.
        unavailable_reason:
          type: string
          description: The forge's own message for a blocked or disabled repository.
        unavailable_url:
          type: string
          description: The https link that message gives.
        metadata_as_of:
          type: string
          format: date-time
          description: The date of the metadata snapshot behind the `metadata_*` counts.
        forge_id_changes:
          type: array
          description: Single-repository answer only. Adopted forge-ID changes (the repository was re-created upstream under the same URL).
          items:
            $ref: '#/components/schemas/ForgeIDChange'
        has_metadata_snapshot:
          type: boolean
          description: Present (true) when a metadata snapshot exists, even one without a date.
    WeeklyDataPoint:
      type: object
      description: |
        One week of the repository time series. Its number is `count`, the
        one native series that predates the `value` convention (see the
        conventions page, "One field name for a metric's number"); `/compare`
        and the Augur-compatible metrics carry `value`.
      required: [week_start, count]
      properties:
        week_start:
          type: string
          format: date-time
          description: The Monday that starts the week (UTC).
        count:
          type: integer
    TimeSeriesResult:
      type: object
      required: [repo_id, repo_name, repo_owner, commits, prs_opened, prs_merged, issues]
      description: Each series lists only the weeks with activity, oldest first; a series with no activity is `[]`.
      properties:
        repo_id:
          type: integer
          format: int64
        repo_name:
          type: string
        repo_owner:
          type: string
        commits:
          type: array
          description: Distinct commits per week by author time.
          items:
            $ref: '#/components/schemas/WeeklyDataPoint'
        prs_opened:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyDataPoint'
        prs_merged:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyDataPoint'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyDataPoint'
    LicenseCount:
      type: object
      required: [license, count, is_osi]
      properties:
        license:
          type: string
          description: The license as a canonical SPDX expression (operands of OR and AND in a fixed order), or `Unknown`.
        count:
          type: integer
        is_osi:
          type: boolean
          description: OSI-approved per the SPDX license list (an OR when any option is, an AND when every term is).
    ScancodeSourceLicense:
      type: object
      required: [license, file_count, is_osi]
      properties:
        license:
          type: string
        file_count:
          type: integer
        is_osi:
          type: boolean
    ScancodeSourceCopyright:
      type: object
      required: [holder, file_count]
      properties:
        holder:
          type: string
        file_count:
          type: integer
    ScancodeFileEntry:
      type: object
      required: [path, license, copyright]
      properties:
        path:
          type: string
        license:
          type: string
          description: The file's detected license, normalized to SPDX.
        copyright:
          type: string
          description: The first copyright holder, at most 120 characters.
    SearchRepoResult:
      type: object
      required: [id, owner, name, starred]
      properties:
        id:
          type: integer
          format: int64
        owner:
          type: string
        name:
          type: string
        starred:
          type: boolean
          description: Whether the caller has starred it; always false without an identity.
    RepoContributor:
      type: object
      required: [cntrb_id, login, full_name, email, profile_company, location, activity_class, public_contribs_year, restricted_contribs_year, last_contribution_year]
      description: One person. Every string is `""` when no value is recorded.
      properties:
        cntrb_id:
          type: string
          format: uuid
        login:
          type: string
        full_name:
          type: string
        email:
          type: string
        profile_company:
          type: string
        location:
          type: string
        activity_class:
          type: string
          enum: [public-active, private-active, dormant, no-observable-activity, ""]
          description: GitHub only (trailing year). `""` when never checked, GitLab-side, or the account was gone at check time.
        public_contribs_year:
          type: integer
        restricted_contribs_year:
          type: integer
        last_contribution_year:
          type: integer
    AffiliationCount:
      type: object
      required: [affiliation, contributor_count]
      properties:
        affiliation:
          type: string
          description: The organization, or `(unknown)`.
        contributor_count:
          type: integer
    ContributionsCoverage:
      type: object
      required: [window_since, window_until, total_contributors, enriched, canonical_email, gh_user_id_resolved, search_resolve_attempted, breadth_attempted, affiliation_resolved, affiliation_unknown]
      properties:
        window_since:
          type: string
          format: date-time
        window_until:
          type: string
          format: date-time
        total_contributors:
          type: integer
        enriched:
          type: integer
        canonical_email:
          type: integer
        gh_user_id_resolved:
          type: integer
        search_resolve_attempted:
          type: integer
        breadth_attempted:
          type: integer
        affiliation_resolved:
          type: integer
        affiliation_unknown:
          type: integer
          description: '`total_contributors` minus `affiliation_resolved`.'
        enrichment_oldest_pending:
          type: string
          format: date-time
          description: Absent when every contributor in the window is enriched.
        enrichment_stalest:
          type: string
          format: date-time
          description: Absent when no contributor in the window is enriched.
    TopContributor:
      type: object
      required: [cntrb_id, login, full_name, activity_class, commits, issues, prs, reviews, comments, total]
      properties:
        cntrb_id:
          type: string
          format: uuid
        login:
          type: string
        full_name:
          type: string
        activity_class:
          type: string
        commits:
          type: integer
          description: Distinct commits authored in the window.
        issues:
          type: integer
          description: Issues opened.
        prs:
          type: integer
          description: Pull requests opened.
        reviews:
          type: integer
          description: Reviews submitted.
        comments:
          type: integer
          description: Issue, pull-request and inline review comments.
        total:
          type: integer
          description: The sum, and the ranking key.
    ElsewhereRepo:
      type: object
      required: [repo_full_name, active_days, commits, issues, prs, reviews]
      properties:
        repo_full_name:
          type: string
        repo_id:
          type: integer
          format: int64
          description: Present only when the repository is collected on this instance.
        active_days:
          type: integer
        commits:
          type: integer
        issues:
          type: integer
        prs:
          type: integer
        reviews:
          type: integer
    ElsewhereContributor:
      type: object
      required: [cntrb_id, login, backfilled_at, elsewhere]
      properties:
        cntrb_id:
          type: string
          format: uuid
        login:
          type: string
        backfilled_at:
          type: [string, "null"]
          format: date-time
          description: '`null` while the history backfill has not reached this contributor: an empty `elsewhere` then means "pending", not "nowhere else". Automation accounts stay `null` by design.'
        elsewhere:
          type: array
          description: Up to ten other repositories, the current one excluded.
          items:
            $ref: '#/components/schemas/ElsewhereRepo'
    ActivityMonth:
      type: object
      required: [month, active_days, commits, issues, prs, reviews]
      properties:
        month:
          type: string
          description: '`YYYY-MM`.'
        active_days:
          type: integer
        commits:
          type: integer
        issues:
          type: integer
        prs:
          type: integer
        reviews:
          type: integer
    ActivityRepo:
      type: object
      required: [repo_full_name, months]
      properties:
        repo_full_name:
          type: string
        repo_id:
          type: integer
          format: int64
          description: Present only when the repository is collected on this instance.
        months:
          type: array
          items:
            $ref: '#/components/schemas/ActivityMonth'
    DayTotal:
      type: object
      required: [day, total]
      properties:
        day:
          type: string
          format: date
        total:
          type: integer
    ContributorActivityView:
      type: object
      required: [cntrb_id, login, backfilled_at, months, repos, day_totals]
      properties:
        cntrb_id:
          type: string
          format: uuid
        login:
          type: string
        backfilled_at:
          type: [string, "null"]
          format: date-time
          description: Same meaning as in `ElsewhereContributor`.
        months:
          type: integer
          description: The window in months, after the cap.
        repos:
          type: array
          description: The ten repositories with the most activity in the window.
          items:
            $ref: '#/components/schemas/ActivityRepo'
        day_totals:
          type: array
          description: The contribution calendar's daily totals, which include disclosed private contributions (so they can exceed the per-repository sum).
          items:
            $ref: '#/components/schemas/DayTotal'
    SupplyChainScope:
      type: object
      required: [kind, repos, source]
      properties:
        kind:
          type: string
          enum: [fleet, user, group]
          description: '`fleet` for an administrator without `group`; `user` (the caller''s groups) for anyone else; `group` with `group`.'
        group_id:
          type: integer
          format: int64
        repos:
          type: integer
          description: Repositories in the scope (0 for `fleet`).
        source:
          type: string
          enum: [matview, live]
          description: '`matview` reads the refreshed supply-chain views (fleet scope); `live` computes over the scope''s repositories.'
    PackageExposure:
      type: object
      required: [ecosystem, package_name, cohort_repos, repos_unresolved, findings, findings_unresolved, pct_unresolved, pct_transitive, median_days_open, worst_severity, max_cvss, n_advisories, distinct_versions_in_use, modal_version, modal_version_share_pct, lead_advisory, lead_cve, lead_severity, lead_fixed_version, lead_advisory_repos, repos_with_known_versions]
      properties:
        ecosystem:
          type: string
        package_name:
          type: string
        cohort_repos:
          type: integer
          description: Repositories in scope with a finding on this package.
        repos_unresolved:
          type: integer
        findings:
          type: integer
        findings_unresolved:
          type: integer
        pct_unresolved:
          type: number
        pct_transitive:
          type: number
        median_days_open:
          type: [number, "null"]
        worst_severity:
          type: string
        max_cvss:
          type: number
        n_advisories:
          type: integer
        distinct_versions_in_use:
          type: integer
        modal_version:
          type: string
        modal_version_share_pct:
          type: [number, "null"]
        lead_advisory:
          type: string
        lead_cve:
          type: string
        lead_severity:
          type: string
        lead_fixed_version:
          type: string
        lead_advisory_repos:
          type: integer
        repos_with_known_versions:
          type: integer
    PackageAdvisory:
      type: object
      required: [vuln_id, cve_id, severity, max_cvss, fixed_version, repos, repos_unresolved, first_seen, advisory_url]
      properties:
        vuln_id:
          type: string
        cve_id:
          type: string
        severity:
          type: string
        max_cvss:
          type: number
        fixed_version:
          type: string
        repos:
          type: integer
        repos_unresolved:
          type: integer
        first_seen:
          type: [string, "null"]
          format: date-time
        advisory_url:
          type: string
          description: The advisory's OSV page.
        cve_url:
          type: string
          description: The CVE record; absent without a CVE id.
    PackageVersionUse:
      type: object
      required: [version, repos]
      properties:
        version:
          type: string
        repos:
          type: integer
    PackageRepoVersion:
      type: object
      required: [version, findings_unresolved, lockfiles]
      properties:
        version:
          type: string
        findings_unresolved:
          type: integer
        lockfiles:
          type: integer
          description: Lockfiles in the repository's current snapshot that resolve the package to this version; 0 is a real answer.
    PackageExposedRepo:
      type: object
      required: [repo_id, repo_owner, repo_name, findings_unresolved, transitive, versions, version_detail]
      properties:
        repo_id:
          type: integer
          format: int64
        repo_owner:
          type: string
        repo_name:
          type: string
        findings_unresolved:
          type: integer
        transitive:
          type: boolean
        versions:
          type: array
          items:
            type: string
        version_detail:
          type: array
          items:
            $ref: '#/components/schemas/PackageRepoVersion'
    NewRepo:
      type: object
      required: [repo_id, owner, name, org, added_at]
      properties:
        repo_id:
          type: integer
          format: int64
        owner:
          type: string
        name:
          type: string
        org:
          type: string
        added_at:
          type: string
          format: date-time
    MetricDef:
      type: object
      description: One metric of the comparison catalog (`MetricDef`).
      required: [id, name, definition, unit, kind, improves_on_chaoss, our_reference_url]
      properties:
        id:
          type: string
          description: The value to pass as `metric`.
        name:
          type: string
        definition:
          type: string
        unit:
          type: string
        kind:
          type: string
          enum: [temporal, snapshot]
          description: '`temporal` metrics are compared by `GET /api/v1/compare`, `snapshot` metrics by `GET /api/v1/compare/snapshot`.'
        improves_on_chaoss:
          type: object
          required: [chaoss_url, delta_note]
          properties:
            chaoss_url:
              type: string
              format: uri
            delta_note:
              type: string
        our_reference_url:
          type: string
          format: uri
    WeeklyPoint:
      type: object
      description: One bucket of a series (`db.WeeklyPoint`).
      required: [bucket, value]
      properties:
        bucket:
          type: string
          format: date-time
          description: The bucket's first instant (UTC); a Monday for `week`, the 1st for `month`.
        value:
          type: number
    CompareEntity:
      type: object
      description: A compared repository or organization, as parsed from `entities` (`entity`).
      required: [kind, label]
      properties:
        kind:
          type: string
          enum: [repo, org]
        repo_id:
          type: integer
          format: int64
          description: '`repo` entities only.'
        host:
          type: string
          description: '`org` entities only.'
        login:
          type: string
          description: '`org` entities only.'
        label:
          type: string
          description: '`owner/name` for a repository, `login (org)` for an organization; the raw entity token when the lookup of labels failed.'
    CompareSeries:
      type: object
      description: One entity's series (`compareSeries`).
      required: [entity, points]
      properties:
        entity:
          $ref: '#/components/schemas/CompareEntity'
        points:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyPoint'
          description: Densified buckets from the entity's own start (see `data_start`) to `until`. Series of one answer may differ in length; align them by `bucket`.
        parts:
          type: object
          description: '`contributor_retention` only: the component series `drive_by` and `repeat`, whose sum is `points`.'
          propertyNames:
            title: part
            enum: [drive_by, repeat]
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/WeeklyPoint'
        data_start:
          type: string
          format: date
          description: The entity's first dateable activity (first issue, change request, commit, or the forge's creation date). Absent when it has none.
    SnapshotValue:
      type: object
      description: One entity's snapshot value (`db.SnapshotValue` with its entity).
      required: [entity, value]
      properties:
        entity:
          $ref: '#/components/schemas/CompareEntity'
        value:
          type: number
        as_of:
          type: string
          format: date-time
          description: When the underlying scan ran; absent when unknown.
        detail:
          type: object
          additionalProperties: true
          description: Metric-specific companions (for example `median_libyear`, `total_count`, `dev_count` for `upstream_dependencies`).
    AddedToGroupNotice:
      type: object
      description: A one-time notice that this request added an entity's collected repositories to one of the caller's groups.
      required: [entity, group]
      properties:
        entity:
          type: string
          description: The entity's label.
        group:
          type: string
          const: Comparisons
    EntityOutOfScope:
      description: |
        A compared entity resolves to no repository the caller may read
        (`resolveEntityRepos`). For an API token, when the entity resolved
        to collected repositories, the body also says how to add them.
      allOf:
        - type: object
          required: [error, entity, hint]
          properties:
            error:
              type: string
              const: entity_out_of_scope
            entity:
              type: string
              description: The entity's label.
            hint:
              type: string
            entity_url:
              type: string
              description: API tokens, repository entities only. The repository's stored URL.
            entity_repo_urls:
              type: array
              items:
                type: string
              description: API tokens, organization entities only. The organization's collected repositories, all added by `add_to_existing_group` in one call.
        - $ref: '#/components/schemas/TokenScopeInstructions'
    Vulnerability:
      type: object
      description: One vulnerability finding (`vulnJSON`).
      required: [vuln_id, package_name, severity, cvss_score, summary, source, advisory_url, first_detected_at, last_seen_at]
      properties:
        vuln_id:
          type: string
          description: The OSV id (GHSA, PYSEC, GO, ...).
        cve_id:
          type: string
        package_name:
          type: string
        package_purl:
          type: string
        ecosystem:
          type: string
        severity:
          type: string
          description: The advisory's severity word as stored (`CRITICAL`, `HIGH`, `MEDIUM`/`MODERATE`, `LOW`), or empty.
        cvss_score:
          type: number
        cvss_vector:
          type: string
        summary:
          type: string
        details:
          type: string
        scanned_version:
          type: string
          description: The version the scan matched, read from `package_purl`'s `@version`; absent when the purl carries none.
        fixed_version:
          type: string
        introduced_version:
          type: string
        source:
          type: string
        aliases:
          type: array
          items:
            type: string
        references:
          description: The advisory's references as OSV published them (raw JSON).
        advisory_url:
          type: string
          format: uri
          description: The OSV page.
        cve_url:
          type: string
          format: uri
          description: The OpenCVE page, when there is a CVE id.
        first_detected_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          description: When the finding stopped being seen. Absent while the repository is still affected.
        declared_requirement:
          type: string
        version_resolution:
          type: string
          description: How the scanned version was obtained (for example `unpinned` when the manifest named a range and no lockfile pinned it).
        dependency_kind:
          type: string
          description: '`direct`, `transitive`, or `self` (an advisory about the repository''s own package).'
        introduced_by:
          type: array
          description: Current transitive findings with lockfile edges only. Up to three direct dependencies that pull the package in, with the path from each.
          items:
            $ref: '#/components/schemas/VulnerabilityChain'
        introduced_by_total_roots:
          type: integer
          description: How many direct dependencies pull the package in (all of them, not only the ones in `introduced_by`).
        dependency_scope:
          type: string
          description: The dependency's scope (runtime, dev, test, build, optional, peer); empty counts as runtime.
    VulnerabilityChain:
      type: object
      description: How a direct dependency pulls a vulnerable package in (`vulnChainJSON`).
      required: [root, chain]
      properties:
        root:
          type: string
          description: The direct dependency.
        chain:
          type: array
          items:
            type: string
          description: The packages from `root` to the vulnerable one.
    LockfileCertainty:
      type: object
      description: How much of the repository's dependency set a lockfile pins (`db.LockfileCertainty`).
      required: [overall, ecosystems]
      properties:
        overall:
          type: string
          enum: [full, partial, none]
        ecosystems:
          type: array
          items:
            $ref: '#/components/schemas/LockfileEcosystemCertainty'
    LockfileEcosystemCertainty:
      type: object
      required: [ecosystem, lockfile_kind, locked_packages]
      properties:
        ecosystem:
          type: string
        lockfile_kind:
          type: string
          description: The lockfile format (`go.mod` for Go, which pins by construction).
        locked_packages:
          type: integer
    ScorecardCheck:
      type: object
      description: One OpenSSF Scorecard check (`db.ScorecardCheck`).
      required: [name, score]
      properties:
        name:
          type: string
        score:
          type: number
          description: 0 to 10; `-1` when the stored value could not be read (not applicable).
    TrafficDay:
      type: object
      description: One stored UTC day of clones or views (`db.TrafficDay`).
      required: [date, count, uniques]
      properties:
        date:
          type: string
          format: date
        count:
          type: [integer, "null"]
          description: Clones or views that day.
        uniques:
          type: [integer, "null"]
          description: Distinct cloners or visitors that day; `null` when the forge does not count them (GitLab clones).
    TrafficWindow:
      type: object
      description: One 14-day window GitHub reported, from its first to its last daily bucket (`db.TrafficWindow`).
      required: [kind, start, end, uniques]
      properties:
        kind:
          type: string
          enum: [views, clones]
        start:
          type: string
          format: date
        end:
          type: string
          format: date
          description: The window's last day, included.
        uniques:
          type: [integer, "null"]
          description: Distinct visitors or cloners over the window, as GitHub computes them; not the sum of the daily uniques.
    TrafficWeek:
      type: object
      description: One complete Monday-to-Sunday week inside a read's window (`db.TrafficWeek`).
      required: [kind, week_start, uniques]
      properties:
        kind:
          type: string
          enum: [views, clones]
        week_start:
          type: string
          format: date
          description: The week's Monday.
        uniques:
          type: [integer, "null"]
          description: Distinct visitors or cloners over the week.
    TrafficPath:
      type: object
      description: One of the top paths GitHub reported for its 14-day period (`db.TrafficPath`).
      required: [path, title, count, uniques]
      properties:
        path:
          type: string
        title:
          type: string
        count:
          type: [integer, "null"]
          description: Views of the path over GitHub's 14-day period.
        uniques:
          type: [integer, "null"]
          description: Distinct visitors of the path over that period.
    TrafficReferrer:
      type: object
      description: One of the top referring sites GitHub reported for its 14-day period (`db.TrafficReferrer`).
      required: [referrer, count, uniques]
      properties:
        referrer:
          type: string
        count:
          type: [integer, "null"]
          description: Views the site sent over GitHub's 14-day period.
        uniques:
          type: [integer, "null"]
          description: Distinct visitors the site sent over that period.
    CollectionSummary:
      type: object
      description: One collection in the list (`db.CollectionSummary`).
      required: [collection_id, name, description, position, groups, repos, starred, created_at]
      properties:
        collection_id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        position:
          type: integer
          description: The administrator's ordering key.
        groups:
          type: integer
          description: How many groups the collection holds.
        repos:
          type: integer
          description: How many distinct repositories its groups hold.
        starred:
          type: boolean
          description: Whether the caller starred it.
        created_at:
          type: string
          format: date-time
    CollectionGroup:
      type: object
      description: One member group of a collection (`db.CollectionGroup`).
      required: [group_id, name, repos]
      properties:
        group_id:
          type: integer
          format: int64
        name:
          type: string
        repos:
          type: integer
    CollectionRepo:
      type: object
      description: One distinct repository of a collection (`db.CollectionRepo`). The counts are the collection queue's cached totals.
      required: [repo_id, owner, name, git_url, issues, prs, commits, starred]
      properties:
        repo_id:
          type: integer
          format: int64
        owner:
          type: string
        name:
          type: string
        git_url:
          type: string
        issues:
          type: integer
          format: int64
        prs:
          type: integer
          format: int64
        commits:
          type: integer
          format: int64
        last_collected:
          type: string
          format: date-time
          description: Absent when never collected.
        last_activity:
          type: string
          format: date-time
          description: The forge's last-updated time from the latest metadata snapshot; absent when none.
        starred:
          type: boolean
    APIToken:
      type: object
      description: A granted API token, without the token or its hash (`db.APIToken`).
      required: [token_id, user_id, owner_login, label, created_by, created_by_login, created_at, expires_at, rate_limit_per_hour, rate_limit_per_day, last_used_at, revoked_at]
      properties:
        token_id:
          type: integer
          format: int64
        user_id:
          type: integer
          description: The account the token authenticates as.
        owner_login:
          type: string
        label:
          type: string
        created_by:
          type: integer
        created_by_login:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        rate_limit_per_hour:
          type: integer
        rate_limit_per_day:
          type: integer
        last_used_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
    APITokenSettings:
      type: object
      description: The defaults a grant offers (`db.APITokenSettings`). The allowances are the `token_requests_per_hour` and `token_requests_per_day` quotas.
      required: [default_rate_limit_per_hour, default_rate_limit_per_day, default_lifetime_days, updated_by, updated_at]
      properties:
        default_rate_limit_per_hour:
          type: integer
        default_rate_limit_per_day:
          type: integer
        default_lifetime_days:
          type: integer
        updated_by:
          type: integer
          description: The administrator who last changed the lifetime; 0 when never changed.
        updated_at:
          type: string
          format: date-time
    EffectiveQuota:
      type: object
      description: A quota as applied (`capacity.EffectiveQuota`).
      required: [name, allowed, mode, source, editable]
      properties:
        name:
          type: string
          enum:
            - repo_links_per_day
            - repos_per_account
            - requests_per_day
            - requests_per_hour
            - signups_per_address_per_day
            - token_requests_per_day
            - token_requests_per_hour
        allowed:
          type: integer
        mode:
          $ref: '#/components/schemas/QuotaMode'
        source:
          type: string
          enum: [WEB, DEFAULT, SHADOW, "OFF"]
          description: The `aveloxis.json` word for this quota. Only `WEB` quotas are set on the Capacity page.
        editable:
          type: boolean
    QuotaMode:
      type: string
      enum: [enforce, shadow, "off"]
      description: '`enforce` refuses past the value; `shadow` counts and logs but never refuses; `off` neither counts nor refuses.'
    SignupDay:
      type: object
      description: New accounts on one UTC day (`db.SignupDay`).
      required: [day, accounts]
      properties:
        day:
          type: string
          format: date-time
        accounts:
          type: integer
    SignupAllowlistEntry:
      type: object
      description: A network exempt from the sign-up quota (`db.SignupAllowlistEntry`).
      required: [cidr, note, added_by, added_at]
      properties:
        cidr:
          type: string
          description: Stored normalised (`192.0.2.0/24`).
        note:
          type: string
        added_by:
          type: [integer, "null"]
        added_at:
          type: string
          format: date-time
    CapacityOverride:
      type: object
      description: One account's own values (`db.CapacityOverride`). `null` means the quota's value.
      required: [user_id, repos_allowed, requests_per_hour, requests_per_day, links_per_day, note, updated_at, updated_by]
      properties:
        user_id:
          type: integer
        repos_allowed:
          type: [integer, "null"]
        requests_per_hour:
          type: [integer, "null"]
        requests_per_day:
          type: [integer, "null"]
        links_per_day:
          type: [integer, "null"]
        note:
          type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: [integer, "null"]
    RepoAllocationStatus:
      type: object
      description: An account's repository allocation (`db.RepoAllocationStatus`).
      required: [used, allowed, mode, exempt, contact]
      properties:
        used:
          type: integer
          description: Repositories across the account's groups, additions waiting for approval included.
        allowed:
          type: integer
        mode:
          $ref: '#/components/schemas/QuotaMode'
        exempt:
          type: boolean
          description: True for an administrator, who is never refused.
        contact:
          type: string
    CapacityAccount:
      type: object
      description: One account's capacity figures (`db.CapacityAccount`).
      required: [user_id, login, provider, admin, override, repos, requests_today]
      properties:
        user_id:
          type: integer
        login:
          type: string
        provider:
          type: string
          description: The forge of the account's last sign-in (an empty legacy value reads as GitHub).
        gitlab_host:
          type: string
          description: A GitLab account's instance.
        admin:
          type: boolean
        override:
          $ref: '#/components/schemas/CapacityOverride'
        repos:
          $ref: '#/components/schemas/RepoAllocationStatus'
        requests_today:
          type: integer
          format: int64
          description: Session requests saved today by the api processes (at most one save period, about a minute, behind).
    OKResult:
      type: object
      description: An administrator mutation's acknowledgement.
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    StarCollectionResult:
      type: object
      required: [ok, starred]
      properties:
        ok:
          type: boolean
          const: true
        starred:
          type: boolean
          description: The collection's star state for the caller after the request.
    CollectionFields:
      type: object
      description: A collection's editable fields. Every field is written.
      required: [name]
      properties:
        name:
          type: string
          description: Unique among collections; not empty.
        description:
          type: string
        position:
          type: integer
          description: The ordering key (lower first).
    MeCapacity:
      type: object
      description: The caller's fair-use numbers (`meCapacity`); request counts are this api process's.
      required: [repos, requests, contact]
      properties:
        repos:
          $ref: '#/components/schemas/RepoAllocationStatus'
        requests:
          type: array
          description: Each counted window of the caller's quotas (quotas that are off or zero are left out); `null` when there are none.
          items:
            type: object
            required: [quota, window, used, allowed, mode, reset_at]
            properties:
              quota:
                type: string
                enum: [requests_per_hour, requests_per_day, token_requests_per_hour, token_requests_per_day]
              window:
                type: string
                enum: [hour, day]
              used:
                type: integer
              allowed:
                type: integer
              mode:
                type: string
                enum: [enforce, shadow]
                description: Quotas that are off are not listed.
              reset_at:
                type: string
                format: date-time
        contact:
          type: string
          description: The address heavy users may write to; empty when none.
    PortalGroup:
      type: object
      description: One of the caller's groups (`groupJSON`).
      required: [group_id, name, status, repo_count, favorited, pending_adds]
      properties:
        group_id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
          enum: [approved, pending, rejected]
        repo_count:
          type: integer
        favorited:
          type: boolean
        pending_adds:
          type: integer
          description: Additions waiting for approval.
    PortalGroupRepo:
      type: object
      description: A repository row of a group listing (`db.PortalGroupRepo`).
      required: [repo_id, owner, name, git_url, issues, prs, commits, starred]
      properties:
        repo_id:
          type: integer
          format: int64
        owner:
          type: string
        name:
          type: string
        git_url:
          type: string
        issues:
          type: integer
          format: int64
          description: The collection queue's cached gathered count.
        prs:
          type: integer
          format: int64
        commits:
          type: integer
          format: int64
        last_collected:
          type: string
          format: date-time
        last_activity:
          type: string
          format: date-time
          description: The forge-reported last activity.
        starred:
          type: boolean
          description: Whether the caller starred it.
    HomeRepo:
      type: object
      description: A home-list row (`db.HomeRepo`).
      required: [repo_id, owner, name, starred, activity_90d]
      properties:
        repo_id:
          type: integer
          format: int64
        owner:
          type: string
        name:
          type: string
        starred:
          type: boolean
        activity_90d:
          type: integer
          description: Issues and pull requests opened in the last 90 days.
    StarResult:
      type: object
      required: [ok, starred]
      properties:
        ok:
          type: boolean
          const: true
        starred:
          type: boolean
          description: '`true` after a star, `false` after an unstar.'
        added_to_group:
          type: string
          const: Starred
          description: Present when this star added the repository to the caller's "Starred" group.
    ForgeIDChange:
      type: object
      description: A recorded forge-ID change (`db.ForgeIDChange`).
      required: [repo_id, old_forge_id, new_forge_id, first_observed_at, last_observed_at]
      properties:
        repo_id:
          type: integer
          format: int64
        old_forge_id:
          type: string
        new_forge_id:
          type: string
        first_observed_at:
          type: string
          format: date-time
        last_observed_at:
          type: string
          format: date-time
        forge_created_at:
          type: string
          format: date-time
          description: When the forge created the new repository; absent when the scan did not list it.
        adopted_at:
          type: string
          format: date-time
          description: Adopted changes only.
        adopted_by:
          type: string
        note:
          type: string
        repo_git:
          type: string
          description: The repository's stored URL.
        superseded:
          type: boolean
          description: A pending change whose old ID is no longer the stored one; it cannot be adopted. Absent when false.
    AugurRepositoryGroup:
      type: object
      description: A legacy repository group (`db.RepoGroupResult`).
      required: [repo_group_id, rg_name]
      properties:
        repo_group_id:
          type: integer
          format: int64
        rg_name:
          type: string
        description:
          type: string
          description: Absent when empty.
        rg_type:
          type: string
          description: Absent when empty (for example `github_org`, `gitlab_group`).
    AugurRepository:
      type: object
      description: A repository in the Augur catalog shape (`db.RepoResult`).
      required: [repo_id, repo_group_id, repo_git, repo_name, repo_owner, platform_id, repo_archived]
      properties:
        repo_id:
          type: integer
          format: int64
        repo_group_id:
          type: integer
          format: int64
          description: 0 when the repository has no legacy group.
        repo_git:
          type: string
          description: The repository's URL.
        repo_name:
          type: string
        repo_owner:
          type: string
        platform_id:
          type: integer
          description: 1 GitHub, 2 GitLab, 3 any other git host.
          enum: [1, 2, 3]
        repo_archived:
          type: boolean
    AugurRepositoryRecord:
      type: object
      description: |
        The internal repository record (`model.Repo`, no JSON tags, so the keys
        are its Go field names). `GET /api/v1/repos/{repoID}` fills only `ID`,
        `Platform`, `GitURL`, `Name` and `Owner`; the rest carry zero values.
      required: [ID, GroupID, Platform, GitURL, Name, Owner, Path, Description, PrimaryLanguage, ForkedFrom, Archived, CreatedAt, UpdatedAt, PlatformID]
      properties:
        ID:
          type: integer
          format: int64
        GroupID:
          type: integer
          format: int64
          description: Always 0 here.
        Platform:
          type: integer
          description: 1 GitHub, 2 GitLab, 3 any other git host.
          enum: [1, 2, 3]
        GitURL:
          type: string
        Name:
          type: string
        Owner:
          type: string
        Path:
          type: string
          description: Always empty here.
        Description:
          type: string
          description: Always empty here.
        PrimaryLanguage:
          type: string
          description: Always empty here.
        ForkedFrom:
          type: string
          description: Always empty here.
        Archived:
          type: boolean
          description: Always `false` here.
        CreatedAt:
          type: string
          format: date-time
          description: Always `0001-01-01T00:00:00Z` here.
        UpdatedAt:
          type: string
          format: date-time
          description: Always `0001-01-01T00:00:00Z` here.
        PlatformID:
          type: string
          description: Always empty here.
    AugurMetricRow:
      type: object
      description: One bucket (or snapshot) of a count series (`db.MetricRow`).
      required: [date, value]
      properties:
        date:
          type: string
          format: date-time
          description: The bucket's first day (midnight UTC), or the snapshot's collection time.
        value:
          type: integer
        repo_name:
          type: string
          description: Absent when empty.
    AugurIssueDurationRow:
      type: object
      description: One closed issue (`db.IssueDurationRow`).
      required: [issue_id, created_at, closed_at, duration_days]
      properties:
        issue_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        duration_days:
          type: number
          description: Days from creation to closing, fractional.
        repo_name:
          type: string
          description: Absent when empty.
    AugurReviewDurationRow:
      type: object
      description: One merged pull request (`db.ReviewDurationRow`).
      required: [pull_request_id, created_at, merged_at, duration_days]
      properties:
        pull_request_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        merged_at:
          type: string
          format: date-time
        duration_days:
          type: number
          description: Days from creation to merge, fractional.
        repo_name:
          type: string
          description: Absent when empty.
    AugurCodeChangesLinesRow:
      type: object
      description: Lines added and removed in one bucket (`db.CodeChangesLinesRow`).
      required: [date, added, removed]
      properties:
        date:
          type: string
          format: date-time
          description: The bucket's first day (midnight UTC).
        added:
          type: integer
          format: int64
        removed:
          type: integer
          format: int64
        repo_name:
          type: string
          description: Absent when empty.
    AugurContributorRow:
      type: object
      description: One contributor's activity in the window (`db.ContributorRow`).
      required: [user_id, commits, issues, pull_requests, issue_comments, pull_request_comments, total]
      properties:
        user_id:
          type: string
          description: The contributor's `cntrb_id` (a UUID).
        commits:
          type: integer
        issues:
          type: integer
        pull_requests:
          type: integer
        issue_comments:
          type: integer
        pull_request_comments:
          type: integer
        total:
          type: integer
          description: The sum of the five counts; the ordering key.
        repo_name:
          type: string
          description: Absent when empty.
    AugurDependencyRow:
      type: object
      description: One dependency with its libyear (`db.DepRow`).
      required: [name, requirement, dep_type, package_manager, current_version, latest_version, libyear]
      properties:
        name:
          type: string
        requirement:
          type: string
          description: The declared requirement; empty when none was recorded.
        dep_type:
          type: string
          description: The dependency's scope as recorded (for example runtime, dev); empty when unknown.
        package_manager:
          type: string
        current_version:
          type: string
        latest_version:
          type: string
        libyear:
          type: number
          description: Years between the used version's release and the latest's; 0 when unknown.
        license:
          type: string
          description: The license as the registry reported it (not normalized). Absent when unknown.
        purl:
          type: string
          description: The package URL. Absent when none was minted.
    AugurReleaseRow:
      type: object
      description: One release (`db.ReleaseRow`).
      required: [release_id, release_name, release_author, release_tag_name, release_created_at]
      properties:
        release_id:
          type: string
        release_name:
          type: string
        release_description:
          type: string
          description: Absent when empty.
        release_author:
          type: string
        release_tag_name:
          type: string
        release_url:
          type: string
          description: Absent when empty.
        release_created_at:
          type: string
          format: date-time
        release_published_at:
          type: string
          format: date-time
          description: Absent when the release was never published.
        repo_name:
          type: string
          description: Absent when empty.
    AugurComplexityRow:
      type: object
      description: Code size and complexity of one language, from scc (`db.ComplexityRow`).
      required: [language, files, lines, blanks, comments, code, complexity]
      properties:
        language:
          type: string
        files:
          type: integer
        lines:
          type: integer
        blanks:
          type: integer
        comments:
          type: integer
        code:
          type: integer
        complexity:
          type: integer
    Error:
      type: object
      description: A refusal written by the API's own JSON writers (authentication, authorization, validation).
      required: [error]
      properties:
        error:
          type: string
          description: A machine-readable code or a sentence; see each operation.
        message:
          type: string
          description: A sentence for a person, present when `error` is a code (`reauthentication_required`).
    UserSession:
      type: object
      description: One live session of an account (0.29.113).
      required: [kind, from_web_session, current, created_at, last_used_at, expires_at]
      properties:
        kind:
          type: string
          enum: [web, api]
          description: '`web` is a browser session of the web GUI; `api` is a Bearer token.'
        from_web_session:
          type: boolean
          description: The token's browser session is still live (every `kind` `api` session is minted from one; `false` once it has expired, and for `kind` `web`).
        current:
          type: boolean
          description: This session presented the request.
        created_at:
          type: string
          format: date-time
          description: When the session was signed in or the token minted.
        last_used_at:
          type: string
          format: date-time
          description: A browser session's last request, to the minute (`created_at` until its first); for `kind` `api`, the mint time.
        expires_at:
          type: string
          format: date-time
    SessionsEnded:
      type: object
      required: [ok, ended]
      properties:
        ok:
          type: boolean
          const: true
        ended:
          type: integer
          minimum: 0
          description: Sessions and tokens deleted.
    CapacityRefusal:
      type: object
      description: |
        A fair-use quota's refusal (`writeCapacityRefusal`). `kind` `rate`
        answers `429` with `Retry-After`; `kind` `allocation` (the
        repositories an account holds) answers `403`: nothing frees up with
        time, so there is no `Retry-After`.
      required: [error, kind, quota, used, allowed, message]
      properties:
        error:
          type: string
          const: capacity_limit
        kind:
          type: string
          enum: [rate, allocation]
        quota:
          type: string
          description: The quota that refused.
          enum:
            - requests_per_hour
            - requests_per_day
            - token_requests_per_hour
            - token_requests_per_day
            - repos_per_account
            - repo_links_per_day
            - shared_with_me_adds_per_hour
        window:
          type: string
          enum: [hour, day]
          description: Rate quotas only. `hour` starts at the window's first counted request; `day` is the UTC day.
        used:
          type: integer
        allowed:
          type: integer
        wanted:
          type: integer
          description: Allocation only. How many more the refused change would have added.
        reset_at:
          type: string
          format: date-time
          description: Rate quotas only. When the window ends (UTC).
        retry_after:
          type: integer
          description: Rate quotas only. Seconds until `reset_at`, the same value as `Retry-After`.
        contact:
          type: string
          description: The address the operator invites heavy users to write to; absent when none is set.
        message:
          type: string
          description: The refusal in a sentence, with the way to make room or the time to retry.
    TokenScopeInstructions:
      type: object
      description: |
        How an API token's owner adds a repository to a group, so the token
        can read it (`tokenScopeInstructions`). Present on an API token's
        out-of-scope refusal when the repository exists.
      properties:
        your_groups:
          type: array
          description: The owner's groups that accept additions.
          items:
            type: object
            required: [group_id, name]
            properties:
              group_id:
                type: integer
                format: int64
              name:
                type: string
        add_to_existing_group:
          $ref: '#/components/schemas/PreparedCall'
        create_group:
          $ref: '#/components/schemas/PreparedCall'
    PreparedCall:
      type: object
      description: A request ready to send.
      required: [method, path, body]
      properties:
        method:
          type: string
          const: POST
        path:
          type: string
          description: The path, with `{group_id}` to fill in where present.
        body:
          type: object
          description: 'The JSON body: `{"url": …, "kind": "repo"}` for one repository, `{"urls": […], "kind": "repo"}` for an organization''s collected repositories, `{"name": …}` for a new group.'
          additionalProperties: true
    RepoOutOfScope:
      description: |
        The caller may not read this repository (`authorizeRepo`). A signed-in
        session is refused only when the repository does not exist or the
        automatic addition to "Shared with Me" could not be made; an API
        token is refused for every repository outside its owner's groups,
        and, when the repository exists, the body says how to add it.
      allOf:
        - type: object
          required: [error, repo_id, hint]
          properties:
            error:
              type: string
              const: repo_out_of_scope
            repo_id:
              type: integer
              format: int64
            hint:
              type: string
            repo_url:
              type: string
              description: API tokens only, when the repository exists. Its stored URL.
        - $ref: '#/components/schemas/TokenScopeInstructions'

  responses:
    NotModified:
      description: The `If-None-Match` validator names the current answer. No body.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    BadRequest:
      description: The request is malformed (an id that is not an integer, a value outside its enum, a missing parameter). The body is one sentence.
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: |
        No valid Bearer token: missing, unknown, expired or revoked. Sent by
        every operation that requires an identity, and by every data
        operation when `api.require_auth` is on (callers on an exempt
        network excepted). Never stored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        The token is valid but may not do this: an API token on an
        administrator or account-settings route, or a session that is not an
        administrator's. Never stored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RepoOutOfScope:
      description: |
        The repository is outside the caller's scope (`repo_out_of_scope`),
        or a signed-in session's automatic addition of it would exceed the
        account's repository allocation (`capacity_limit`, `kind`
        `allocation`). Never stored.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/RepoOutOfScope'
              - $ref: '#/components/schemas/CapacityRefusal'
    EntityOutOfScope:
      description: |
        A compared entity resolves to no repository the caller may read
        (`entity_out_of_scope`; for an API token, with the way to add it),
        or a signed-in session's automatic addition would exceed the
        account's repository allocation (`capacity_limit`, `kind`
        `allocation`). Never stored.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/EntityOutOfScope'
              - $ref: '#/components/schemas/CapacityRefusal'
    NotFound:
      description: No such resource.
      content:
        text/plain:
          schema:
            type: string
    RepoNotFound:
      description: No repository has this id (`repo not found`). Every repository route answers it before deciding the caller's scope (since 0.29.99; an unknown id was a `403` for tokens and sessions before), so it says nothing about the caller.
      content:
        text/plain:
          schema:
            type: string
    TooManyRequests:
      description: |
        Refused by a rate limit; retry after `Retry-After` seconds. A caller
        without a valid token is limited per address (`api.rate_limit_rps`,
        `api.rate_limit_burst`, `api.rate_limit_daily`) and gets the plain
        text `rate limit exceeded`. A session or an API token is limited by
        its quotas and gets the `capacity_limit` body, sent `Cache-Control:
        private, no-store`; so does a session's automatic addition past
        `shared_with_me_adds_per_hour`, and an operation that links
        repositories into a group past the account's `repo_links_per_day`.
        The per-address text carries no cache directive.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CapacityRefusal'
        text/plain:
          schema:
            type: string
            description: '`rate limit exceeded` and a newline (the per-address limit).'
    ServerError:
      description: |
        A server-side failure. The body never carries the cause (`internal
        error; try again`, or a fixed phrase); the cause is in the api log.
      content:
        text/plain:
          schema:
            type: string
    ServiceUnavailable:
      description: |
        Retry later; this is never a sign-out. Either a presented token could
        not be checked because the database failed (JSON, `session lookup
        failed; try again`), or the request ran past `http_timeout_seconds`
        and was cut off (plain text, `request exceeded
        http_timeout_seconds`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/plain:
          schema:
            type: string
            description: '`request exceeded http_timeout_seconds` and a newline.'
