# Run linting checks on pushes to main and pull requests.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # go vet is the official Go linter — always compatible with the Go version.
      - name: Run go vet
        run: go vet ./...

      # staticcheck is the most widely used third-party Go linter and ships
      # updates for new Go versions faster than golangci-lint.
      # If staticcheck doesn't support the current Go version yet, we fall
      # back to go vet only (which already ran above).
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        # Blocking since v0.25.36 — the codebase is staticcheck-clean and
        # SA-class findings (e.g. SA4010 dead append) are bug-shaped.
        run: staticcheck ./...

      # golangci-lint is the third blocking tier (v0.27.36, summary/18
      # Phase 0a): errcheck + govet + ineffassign + staticcheck + unused
      # per .golangci.yml, which carries the exclusion philosophy. The
      # version is PINNED so a new linter release can't break builds by
      # surprise — bump it deliberately, run locally first.
      #
      # Uncached (v0.29.65, PR #212): from 2026-09-22 every run failed with
      # false SA5011 reports on t.Fatal-guarded test code, a different set
      # of files each run, while the plain staticcheck step above passed on
      # the same tree. The restored analysis cache was stale; the step takes
      # seconds without it.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout 10m
          skip-cache: true

      # O13 (v0.29.71): a newly reachable known vulnerability and an untidy
      # go.mod used to merge unnoticed. govulncheck reports only
      # vulnerabilities in code the module actually calls; PINNED like
      # golangci-lint, so a new release cannot fail builds by surprise.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # `go mod tidy -diff` prints the change tidy would make and exits
      # nonzero instead of editing go.mod / go.sum.
      - name: Check go.mod is tidy
        run: go mod tidy -diff
