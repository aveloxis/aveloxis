        "404":
          $ref: '#/components/responses/RepoNotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/contributors/{cntrbID}/activity:
    get:
      operationId: contributorActivity
      summary: Returns one contributor's monthly activity per repository and daily contribution totals.
      description: |
        Requires an identity but no repository scope: the history spans
        repositories this instance does not collect. For an API token,
        collected repositories outside its owner's groups are left out.
        Answers are cached for 60 seconds.

        Handler: `handleContributorActivity`.
      tags: [Contributors]
      security: [{sessionToken: []}, {apiToken: []}]
