# Integration tests against a live Postgres service container.
#
# Runs alongside test.yml (the unit-tier workflow) on every push and
# pull request. The unit job in test.yml stays fast — no DB, no
# service spin-up — and gives PR contributors quick feedback. This
# workflow trades a few seconds of service-container boot for the
# ability to catch the v0.21.0 bug shape (migration SQL that
# references a non-existent column / wrong schema / wrong table)
# before the change merges.
#
# Why a separate workflow rather than extending test.yml: separation
# of concerns. A green "Tests" status means the unit tier passed; a
# green "Integration" status means the migration ran end-to-end
# against a real Postgres. If only one is green, the failure mode
# is obvious from the badge.

name: Integration

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest

    # Postgres 16 service container, empty on every job invocation.
    # AVELOXIS_TEST_DB names its database as the BASE: each test package
    # creates, migrates and drops a database of its own from it
    # (internal/testdb; the service user is a superuser, so CREATEDB).
    # health-cmd + retries ensure the steps below don't try to connect
    # before Postgres is accepting connections; ports binding to
    # 5432:5432 makes the service reachable on localhost.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aveloxis_test
          POSTGRES_PASSWORD: aveloxis_test
          POSTGRES_DB: aveloxis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The integration test (and any future AVELOXIS_TEST_DB-gated
      # tests) read this and connect. sslmode=disable matches the
      # default postgres:16 image configuration. The DSN points at
      # localhost because GitHub Actions exposes service container
      # ports via the runner's loopback interface.
      AVELOXIS_TEST_DB: postgres://aveloxis_test:aveloxis_test@localhost:5432/aveloxis_test?sslmode=disable
      # v0.27.29 — run the ENTIRE integration tier under a non-UTC
      # timezone. The 2026-07-10 flat-line bug (date_trunc in a
      # non-UTC session vs a UTC grid → every chart value silently
      # zero) could never reproduce in CI because CI ran UTC; the
      # 2026-07-21 audit found the same class latent in metrics.go's
      # ::DATE casts. TZ makes Go's time.Local non-UTC and PGTZ makes
      # every postgres session non-UTC, so ANY Go↔SQL timezone
      # disagreement in ANY integration test now fails loudly here
      # instead of shipping. America/Chicago = the operator's zone,
      # where the original bug was live.
      TZ: America/Chicago
      PGTZ: America/Chicago

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      # Run only the integration-tier tests. Filtering by name keeps
      # this job focused — the unit tests already ran in test.yml.
      # If a future integration test is added with a different
      # naming pattern, update the -run regex here.
      - name: Run migration integration tests
        run: |
          go test ./internal/db/ \
            -run "TestRunMigrationsOnFreshDB|TestRunMigrationsIsIdempotent|TestRealign" \
            -count=1 -v

      # Final sanity check: run the entire test suite with the env
      # var still set. Any other AVELOXIS_TEST_DB-gated tests that
      # exist now or get added later will run here too, against the
      # same Postgres service container.
      # -race here is deliberate (v0.25.36): test.yml runs -race but has
      # no DB, so the worker pools / KeyPool / caches never executed under
      # the race detector before this. This is the only tier where the
      # goroutine-heavy paths actually run.
      # -shuffle=on (v0.29.57): each package now runs in a fresh database of
      # its own, so a test that only passes because an earlier test left
      # rows behind is an ORDER dependency; shuffling surfaces it (one was
      # found this way: an explicit repo_group_id = 1 that collided with the
      # Default group's sequence). A failure prints `-test.shuffle N`;
      # rerun with that seed to reproduce.
      - name: Run full suite with integration tier enabled
        run: go test -race -count=1 -shuffle=on ./...

      # v0.27.43: smoke-test the data-verify command end to end (build →
      # connect → probe → report) on every PR. The base database is
      # migrated first: since v0.29.57 the test packages run in databases
      # of their own and nothing else touches it. The residue check this
      # step also used to be — an integration test leaking rows that break
      # an invariant the battery rates FAIL (cached queue counts that
      # disagree with the tables, duplicate Default groups, case-variant
      # duplicate repos, new cross-kind message collisions) — now runs per
      # package, over each package's own database after its tests pass
      # (testdb.Main's verify hook), so it names the package that leaked.
      # The production and --ground-truth probes deliberately do NOT
      # run in CI (no prod credentials in Actions; ground truth needs
      # API keys + a DB with collected repos) — those are host-side
      # cron territory.
      - name: Run data-verify against the CI database
        run: |
          go build -o /tmp/aveloxis ./cmd/aveloxis
          cat > /tmp/ci-verify.json <<'CFG'
          {"database": {"host": "localhost", "port": 5432,
            "dbname": "aveloxis_test", "user": "aveloxis_test",
            "password": "aveloxis_test", "sslmode": "disable"}}
          CFG
          /tmp/aveloxis migrate -c /tmp/ci-verify.json
          /tmp/aveloxis data-verify -c /tmp/ci-verify.json
