            text/plain:
              schema:
                type: string
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/supply-chain/packages:
    get:
      operationId: supplyChainPackages
      summary: Returns the packages with vulnerability findings across the caller's repositories, one row per package.
      description: |
        The scope is the whole fleet for an administrator's session without
        `group` (read from the refreshed supply-chain views), the caller's
        groups for anyone else, or one group with `group` (computed live).
        Answers are cached for 60 seconds.

        Handler: `handleSupplyChainPackages`.
      tags: [Supply chain]
      security: [{sessionToken: []}, {apiToken: []}]
      parameters:
        - name: group
          in: query
          required: false
          description: A group id the caller owns (any group for an administrator).
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: ecosystem
          in: query
          required: false
          description: Only this ecosystem (matched lower-cased).
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Literal substring of the package name.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [repos, unresolved, cvss, transitive, versions, days, name]
            default: repos
        - name: limit
          in: query
          required: false
          description: Rows per page; values that are not positive mean 50, larger values are capped at 500.
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          description: Rows to skip; negative means 0.
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: One page of packages.
          content:
            application/json:
              schema:
                type: object
                required: [scope, total, packages, sort, generated_at]
                properties:
                  scope:
                    $ref: '#/components/schemas/SupplyChainScope'
                  total:
                    type: integer
                    description: Packages matching, across all pages.
                  packages:
                    type: array
                    items:
                      $ref: '#/components/schemas/PackageExposure'
                  sort:
                    type: string
                    description: The sort in effect.
                  generated_at:
                    type: string
                    format: date-time
        "400":
          description: '`invalid sort`, or `invalid group` (not a positive integer).'
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: '`group not found` (no such group, or one the caller does not own).'
          content:
            text/plain:
              schema:
                type: string
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          description: '`group lookup failed` or `package list failed`; the cause is in the api log.'
          content:
            text/plain:
              schema:
                type: string
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/supply-chain/packages/{ecosystem}/{name}:
    get:
      operationId: supplyChainPackage
      summary: Returns one package's exposure, advisories, versions in use and affected repositories in the caller's scope.
      description: |
        The scope rules of `supplyChainPackages`. `name` is the rest of the
        path and may contain slashes (Maven and Go names). Answers are
        cached for 60 seconds.

        Cost: four queries over the scope's findings on a cache miss.

        Handler: `handleSupplyChainPackage`.
      tags: [Supply chain]
      security: [{sessionToken: []}, {apiToken: []}]
      parameters:
        - name: ecosystem
          in: path
          required: true
          description: The ecosystem (matched lower-cased).
          schema:
            type: string
        - name: name
          in: path
          required: true
          description: The package name; every remaining path segment.
          schema:
            type: string
        - name: group
          in: query
          required: false
          description: A group id the caller owns (any group for an administrator).
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: repos
          in: query
          required: false
          description: Affected repositories to list; values that are not positive mean 50, larger values are capped at 500.
          schema:
