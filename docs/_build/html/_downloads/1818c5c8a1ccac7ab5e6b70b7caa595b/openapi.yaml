                      $ref: '#/components/schemas/PackageExposedRepo'
                  generated_at:
                    type: string
                    format: date-time
        "400":
          description: An empty ecosystem or name, or `invalid group`.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: '`package has no findings in this scope`, or `group not found`.'
          content:
            text/plain:
              schema:
                type: string
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          description: A fixed phrase naming the part that failed (`package profile failed`, …); the cause is in the api log.
          content:
            text/plain:
              schema:
                type: string
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/home/new-repos:
    get:
      operationId: newRepositories
      summary: Returns the repositories added to the fleet, and to the caller's groups, in the last days.
      description: |
        Two lists of at most 200 each, newest first. `fleet` holds the
        repositories under organizations an administrator registered; `mine`
        the repositories under organizations the caller registered (a
        repository can be in both). Only collected, unarchived repositories
        under an organization of a group that was not rejected are listed:
        a repository added on its own, not through an organization, never
        appears. Answers are cached for 60 seconds per caller.

        Handler: `handleNewRepos`.
      tags: [Home]
      security: [{sessionToken: []}, {apiToken: []}]
      parameters:
        - name: days
          in: query
          required: false
          description: How far back; values that are not positive integers mean the default, larger values are capped at 90.
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: The two lists.
          content:
            application/json:
              schema:
                type: object
                required: [days, fleet, mine]
                properties:
                  days:
                    type: integer
                    description: The window in effect.
                  fleet:
                    type: array
                    maxItems: 200
                    items:
                      $ref: '#/components/schemas/NewRepo'
                  mine:
                    type: array
                    maxItems: 200
                    items:
                      $ref: '#/components/schemas/NewRepo'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/metrics:
    get:
      operationId: metricCatalog
      summary: Returns the comparison metric catalog.
      description: |
        The definitions behind `GET /api/v1/compare` and
        `GET /api/v1/compare/snapshot`, with what each improves on the
        CHAOSS metric it follows. Constant for a release; sent with
        `Cache-Control: public, max-age=3600`.

        Handler: `handleMetricsCatalog`.
      tags: [Comparison]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      responses:
        "200":
          description: The catalog.
          headers:
            Cache-Control:
              description: '`public, max-age=3600`.'
              schema:
                type: string
                const: public, max-age=3600
          content:
            application/json:
              schema:
                type: object
                required: [branding, metrics]
                properties:
                  branding:
                    type: string
                    const: Improvements on CHAOSS metrics
                  metrics:
                    type: array
                    items:
                      $ref: '#/components/schemas/MetricDef'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/compare:
    get:
      operationId: comparison
      summary: Returns one temporal metric's series for up to seven repositories or organizations.
      description: |
        Each entity's series is densified (every bucket present) from the
        later of `since` and the entity's first activity (`data_start`) to
        `until`, so series of one answer may differ in length: align them
        by `bucket`. An organization is the union of its collected
        repositories (at most 500).

        Every entity must be readable by the caller. A signed-in session
        that names a collected entity outside its groups has the entity's
        collected repositories added to its "Comparisons" group, and the
        answer lists that in `added_to_group` (such an answer is not
        cached). An API token is refused instead (`403`
        `entity_out_of_scope`, with the way to add the entity). Every
        compared repository a signed-in caller may read is also recorded in
        its "Comparisons" group, silently.

        Whole answers are cached for 60 seconds per caller and query
        (`X-Cache: hit`). No `ETag` is sent.

        Cost: one aggregate per entity and metric over the window, each
        entity's series reused while its repositories' collection state is
        unchanged.

        Handler: `handleCompare`.
      tags: [Comparison]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - name: metric
          in: query
          required: true
          description: A `temporal` id from the metric catalog.
          schema:
            type: string
            enum: [contributors, change_requests, change_requests_merged, issues, issues_closed, code_change_commits, committers, burstiness, project_velocity, contributor_retention]
        - name: entities
          in: query
          required: true
          description: 'Comma-separated, at most 7: `repo:<id>` or `org:<host>/<login>`.'
          schema:
            type: string
            examples: ['repo:1,org:github.com/chaoss']
        - name: since
          in: query
          required: false
          description: |
            First day (`YYYY-MM-DD`). Default: the bucket boundary three years
            before `until`'s bucket. Unlike the repository routes, a value
            that does not parse is a `400`.
          schema:
            type: string
            format: date
        - name: until
          in: query
          required: false
          description: A day (`YYYY-MM-DD`; default today, UTC), never later than the latest plausible commit time, then truncated to the start of its week or month. The window ends there, exclusive, so the series ends at the last complete bucket before that day. A value that does not parse is a `400`.
          schema:
            type: string
            format: date
        - name: bucket
          in: query
          required: false
          schema:
            type: string
            enum: [week, month]
            default: week
        - name: retention_threshold
          in: query
          required: false
          description: '`contributor_retention` only. Contributions (over all collected history) that make a contributor "repeat" rather than "drive-by".'
          schema:
            type: integer
            minimum: 1
            default: 4
      responses:
        "200":
          description: The series.
          headers:
            X-Cache:
              $ref: '#/components/headers/XCache'
          content:
            application/json:
              schema:
                type: object
                required: [metric, bucket, since, until, series]
                properties:
                  metric:
                    $ref: '#/components/schemas/MetricDef'
                  bucket:
                    type: string
                    enum: [week, month]
                  since:
                    type: string
                    format: date
                    description: The effective window start.
                  until:
                    type: string
                    format: date
                    description: The effective window end (exclusive bucket boundary).
                  series:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompareSeries'
                  added_to_group:
                    type: array
                    description: Present only when this request added entities to the caller's "Comparisons" group.
                    items:
                      $ref: '#/components/schemas/AddedToGroupNotice'
        "400":
          description: '`metric` is not a temporal catalog id; `entities` is missing, malformed or longer than 7; a date does not parse; `since` is not before `until`; `bucket` is not `week` or `month`; or `retention_threshold` is not a positive integer.'
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/EntityOutOfScope'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/compare/snapshot:
    get:
      operationId: comparisonSnapshot
      summary: Returns one snapshot metric's current value for up to seven repositories or organizations.
      description: |
        The same entities and scope rules as `GET /api/v1/compare`
        (automatic addition for a session, refusal for an API token,
        `added_to_group`). Not cached.

        Handler: `handleCompareSnapshot`.
      tags: [Comparison]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - name: metric
          in: query
          required: true
          description: A `snapshot` id from the metric catalog.
          schema:
            type: string
            enum: [labor_investment, upstream_dependencies, license_coverage]
        - name: entities
          in: query
          required: true
          description: 'Comma-separated, at most 7: `repo:<id>` or `org:<host>/<login>`.'
          schema:
            type: string
      responses:
        "200":
          description: One value per entity, in request order.
          content:
            application/json:
              schema:
                type: object
                required: [metric, values]
                properties:
                  metric:
                    $ref: '#/components/schemas/MetricDef'
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/SnapshotValue'
                  added_to_group:
                    type: array
                    description: Present only when this request added entities to the caller's "Comparisons" group.
                    items:
                      $ref: '#/components/schemas/AddedToGroupNotice'
        "400":
          description: '`metric` is not a snapshot catalog id, or `entities` is missing, malformed or longer than 7.'
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/EntityOutOfScope'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/entities/search:
    get:
      operationId: entitySearchResults
      summary: Returns the repositories and organizations whose names match a query, for the comparison picker.
      description: |
        Up to 20 repositories (each classed `in_scope`, chartable now, or
        `collected`, which a session's compare would add) and up to 10
        organizations. When no repository matches and the query looks like
        a forge path or URL, `uncollected` carries one entry: the query,
        which is not collected yet. Empty lists are `[]`.

        Handler: `handleEntitiesSearch`.
      tags: [Comparison]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - name: q
          in: query
          required: true
          description: Case-insensitive text matched against repository name, owner and URL, and organization login.
          schema:
            type: string
      responses:
        "200":
          description: The matches.
          content:
            application/json:
              schema:
                type: object
                required: [repos, orgs, uncollected]
                properties:
                  repos:
                    type: array
                    items:
                      type: object
                      required: [entity, label, class]
                      properties:
                        entity:
                          type: string
                          description: '`repo:<id>`, ready for `entities`.'
                        label:
                          type: string
                          description: '`owner/name`.'
                        class:
                          type: string
                          enum: [in_scope, collected]
                  orgs:
                    type: array
                    items:
                      type: object
                      required: [entity, label, repo_count]
                      properties:
                        entity:
                          type: string
                          description: '`org:<host>/<login>`.'
                        label:
                          type: string
                        repo_count:
                          type: integer
                  uncollected:
                    type: array
                    items:
                      type: object
                      required: [query, class, hint]
                      properties:
                        query:
                          type: string
                        class:
                          type: string
                          const: uncollected
                        hint:
                          type: string
        "400":
          description: '`q` is missing or blank.'
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}/vulnerabilities:
    get:
      operationId: repositoryVulnerabilities
      summary: Returns a repository's vulnerability findings, current and resolved, with their counts.
      description: |
        Every finding the OSV scans recorded for the repository's
        dependencies. A finding with `resolved_at` is history. `counts`
        classifies each finding once: `resolved`; `self` (an advisory about
        the repository's own package); `unknown_version` (an unpinned
        range, except GitHub Actions refs); otherwise `current`, split into
        `direct`/`transitive` and `runtime`/`dev`, with `critical` (severity
        `CRITICAL` or CVSS 9.0 and up) counted within `current` and
        `unknown_version_critical` within `unknown_version`.

        Current transitive findings carry `introduced_by` when the
        repository's lockfiles give the dependency edges. When the edge or
        certainty lookups fail, the findings are still served, without that
        part, and the answer is not cached.

        Handler: `handleRepoVulnerabilities`.
      tags: [Vulnerabilities]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        "200":
          description: The findings.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Aveloxis-Added-To-Group:
              $ref: '#/components/headers/AddedToGroup'
          content:
            application/json:
              schema:
                type: object
                required: [repo_id, vulnerabilities, scanned_at, lockfile_certainty, counts]
                properties:
                  repo_id:
                    type: integer
                    format: int64
                  vulnerabilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vulnerability'
                  scanned_at:
                    type: [string, "null"]
                    format: date-time
                    description: The last vulnerability scan; `null` when never scanned (an empty list then means "not scanned", not "no findings").
                  lockfile_certainty:
                    $ref: '#/components/schemas/LockfileCertainty'
                  counts:
                    type: object
                    required: [current, resolved, critical, direct, transitive, dev, runtime, self, unknown_version, unknown_version_critical]
                    properties:
                      current:
                        type: integer
                      resolved:
                        type: integer
                      critical:
                        type: integer
                      direct:
                        type: integer
                      transitive:
                        type: integer
                      dev:
                        type: integer
                      runtime:
                        type: integer
                      self:
                        type: integer
                      unknown_version:
                        type: integer
                      unknown_version_critical:
                        type: integer
        "304":
          $ref: '#/components/responses/NotModified'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "404":
          $ref: '#/components/responses/RepoNotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}/scorecard:
    get:
      operationId: repositoryScorecard
      summary: Returns a repository's latest OpenSSF Scorecard checks and overall score.
      description: |
        `scanned` is false (and `checks` `[]`) when no Scorecard run is
        stored. `mode` is `remote` for the complete check set, `local` for
        the subset Scorecard computes from a clone alone, and empty for a
        scan that predates the distinction. `overall` is absent for scans
        stored before the aggregate was kept.

        Handler: `handleRepoScorecard`.
      tags: [Vulnerabilities]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        "200":
          description: The checks.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Aveloxis-Added-To-Group:
              $ref: '#/components/headers/AddedToGroup'
          content:
            application/json:
              schema:
                type: object
                required: [repo_id, checks, scanned]
                properties:
                  repo_id:
                    type: integer
                    format: int64
                  checks:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScorecardCheck'
                  scanned:
                    type: boolean
                  mode:
                    type: string
                    enum: [remote, local, ""]
                    description: Present when `scanned`.
                  overall:
                    type: number
                    description: The aggregate score, 0 to 10.
                  as_of:
                    type: string
                    format: date-time
                    description: When the stored run was collected.
        "304":
          $ref: '#/components/responses/NotModified'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "404":
          $ref: '#/components/responses/RepoNotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/repos/{repoID}/traffic:
    get:
      operationId: repositoryTraffic
      summary: Returns a repository's stored traffic history.
      description: |
        Everything stored from the forge's traffic and statistics APIs, in
        one answer without paging: every daily row of clones and views,
        every 14-day window and complete week, and the latest top paths and
        referrers. A day with a row was read, even when its counts are 0. A
        GitLab repository answers its daily clones with `uniques` null,
        empty lists for the rest and a `null` `snapshot_date`. So does a
        repository whose key the forge refuses, and an id with no
        repository, to an unscoped caller (a scoped caller gets the `403`).
        Grows by about 730 daily rows a year; the read is indexed by
        repository.

        Handler: `handleRepoTraffic`.
      tags: [Repositories]
      security: [{sessionToken: []}, {apiToken: []}, {}]
      parameters:
        - $ref: '#/components/parameters/RepoID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        "200":
          description: The stored traffic.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Cache:
              $ref: '#/components/headers/XCache'
            X-Aveloxis-Added-To-Group:
              $ref: '#/components/headers/AddedToGroup'
          content:
            application/json:
              schema:
                type: object
                required: [repo_id, clones, views, windows, weeks, snapshot_date, paths, referrers]
                properties:
                  repo_id:
                    type: integer
                    format: int64
                  clones:
                    type: array
                    description: Daily clones and distinct cloners.
                    items:
                      $ref: '#/components/schemas/TrafficDay'
                  views:
                    type: array
                    description: Daily views and distinct visitors.
                    items:
                      $ref: '#/components/schemas/TrafficDay'
                  windows:
                    type: array
                    description: One row per kind for each successful read.
                    items:
                      $ref: '#/components/schemas/TrafficWindow'
                  weeks:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrafficWeek'
                  snapshot_date:
                    type: [string, "null"]
                    format: date
                    description: |
                      The latest UTC collection date that stored a path or a
                      referrer; `paths` and `referrers` are that date's
                      snapshot. `null` when none was ever stored.
                  paths:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrafficPath'
                  referrers:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrafficReferrer'
        "304":
          $ref: '#/components/responses/NotModified'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/RepoOutOfScope'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/collections:
    get:
      operationId: collections
      summary: Returns every collection, with the caller's stars.
      description: |
        Collections are administrator-curated groups of groups, readable by
        every signed-in caller.

        Handler: `handleCollectionsList`.
      tags: [Collections]
      security: [{sessionToken: []}, {apiToken: []}]
      responses:
        "200":
          description: The collections.
          content:
            application/json:
              schema:
                type: object
                required: [collections]
                properties:
                  collections:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectionSummary'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/collections/{collectionID}:
    get:
      operationId: collection
      summary: Returns a collection's member groups and one page of its distinct repositories.
      description: |
        The counts are the collection queue's cached totals. The envelope
        echoes the effective page, size, sort and direction (an unknown sort
        falls back to `name`). An id with no collection answers `200` with
        empty `groups` and `repos`.

        Handler: `handleCollectionDetail`.
      tags: [Collections]
      security: [{sessionToken: []}, {apiToken: []}]
      parameters:
        - $ref: '#/components/parameters/CollectionID'
        - name: page
          in: query
          required: false
          description: '1-based page; values below 1 read as 1.'
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          description: 'Rows per page; values below 1 read as 50, values above 100 as 100.'
          schema:
            type: integer
            default: 50
        - name: sort
          in: query
          required: false
          description: 'Sort key from the collection-listing allowlist (`name`, `issues`, `prs`, `commits`, `collected`, `activity`); anything else sorts by `name`.'
          schema:
            type: string
            default: name
        - name: dir
          in: query
          required: false
          description: '`desc` (any case) for descending; anything else is ascending.'
          schema:
            type: string
            default: asc
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                type: object
                required: [collection_id, groups, repos, total, page, page_size, sort, dir]
                properties:
                  collection_id:
                    type: integer
                    format: int64
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectionGroup'
                  repos:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectionRepo'
                  total:
                    type: integer
                    description: Distinct repositories in the collection.
                  page:
                    type: integer
                  page_size:
                    type: integer
                  sort:
                    type: string
                  dir:
                    type: string
                    description: '`asc` or `desc`: the direction applied (0.29.100; a `DESC` sent is echoed as `desc`).'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: No collection with that id (0.29.100; it answered 200 with an empty page).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/collections/{collectionID}/copy:
    post:
      operationId: copyCollectionToGroup
      summary: Links every repository of a collection into one of the caller's groups.
      description: |
        Names the target by `group_id` or, when that is absent or 0, by
        `group_name` (found or created). The copy fits the caller's
        repository allocation (else `403`) and its daily additions (else
        `429`, quota `repo_links_per_day`), or adds nothing. An id with no collection adds
        nothing (`added` 0).

        Handler: `handleCollectionCopy`.
      tags: [Collections]
      security: [{sessionToken: []}, {apiToken: []}]
      parameters:
        - $ref: '#/components/parameters/CollectionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                group_id:
                  type: integer
                  format: int64
                  description: One of the caller's groups.
                group_name:
                  type: string
                  description: Used when `group_id` is absent or 0.
      responses:
        "200":
          description: The repositories newly linked.
          content:
            application/json:
              schema:
                type: object
                required: [added, group_id]
                properties:
                  added:
                    type: integer
                    format: int64
                  group_id:
                    type: integer
                    format: int64
        "400":
          description: The id is not an integer, the body is not JSON, or neither `group_id` nor `group_name` is given.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The target group is not the caller's (`text/plain`), or the copy does not fit the account's repository allocation (`capacity_limit`, `kind` `allocation`).
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityRefusal'
        "404":
          description: No collection with that id (0.29.100; it answered 200 and linked nothing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/collections/{collectionID}/star:
    put:
      operationId: starCollection
      summary: Stars a collection for the caller.
      description: |
        Stars only order the caller's list. Starring twice is a no-op.

        Handler: `handleStarCollection`.
      tags: [Collections]
      security: [{sessionToken: []}, {apiToken: []}]
      parameters:
        - $ref: '#/components/parameters/CollectionID'
      responses:
        "200":
          description: Starred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StarCollectionResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: No collection with that id.
          content:
            text/plain:
              schema:
                type: string
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: unstarCollection
      summary: Removes the caller's star from a collection.
      description: |
        Removing a star that is not there is a no-op (`200`), also for an id
        with no collection.

        Handler: `handleStarCollection`.
      tags: [Collections]
      security: [{sessionToken: []}, {apiToken: []}]
      parameters:
        - $ref: '#/components/parameters/CollectionID'
      responses:
        "200":
          description: Not starred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StarCollectionResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/collections:
    post:
      operationId: createCollection
      summary: Creates a collection.
      description: |
        Collection names are unique; a name already taken is answered `500`
        (the constraint error is not mapped to `409`).

        Handler: `handleAdminCollectionCreate`.
      tags: [Admin collections]
      security: [{sessionToken: [admin]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionFields'
      responses:
        "200":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [collection_id]
                properties:
                  collection_id:
                    type: integer
                    format: int64
        "400":
          description: The body is not JSON or `name` is empty (`name required`).
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          description: A collection with that name already exists (0.29.100; it was a 500).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/ServerError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/collections/{collectionID}:
