# NumFocus project catalog.
# Sources:
#   - numfocus.org/sponsored-projects (63 projects, HTML fixture in testdata/)
#   - numfocus.org/sponsored-projects/affiliated-projects (103 projects, HTML fixture in testdata/)
#   - operator's Augur DB group_id=28 curation (102 distinct orgs, ~4 years old)
#     used as a cross-validation signal for the org field; not authoritative
#     for every entry (some Augur orgs are name-collision noise, e.g. `arviz`
#     is a personal account, not the actual ArviZ project which is `arviz-devs`).
#
# To refresh:
#   1. `aveloxis load-numfocus-projects --detect-new` (or --detect-new with
#      load-numfocus-orgs) scrapes the numfocus.org listing pages and reports
#      any new entries not in this YAML.
#   2. Edit this file to add the new entries with org + primary_repo coords.
#     Run gh search repos to verify ambiguous mappings.
#   3. Commit + redeploy.
#
# Schema per entry:
#   slug:         numfocus.org URL slug or normalized name. Stable identifier.
#   name:         Display name as shown on numfocus.org.
#   platform:     github | gitlab | savannah | other
#   org:          Owner namespace on the platform (e.g. "numpy", "scikit-learn").
#                 Empty if needs_review.
#   primary_repo: Flagship repository within the org (e.g. "numpy", "pandas").
#                 Empty if needs_review. Combined with `org`, this is the
#                 full slug "{org}/{primary_repo}" that load-numfocus-projects
#                 inserts.
#   confidence:   high | medium | low | needs_review
#                 - high: verified against Augur DB AND/OR is a household-name
#                   project with an unambiguous canonical repo.
#                 - medium: confident but not Augur-confirmed.
#                 - low: best guess, no Augur match, name has ambiguity.
#                 - needs_review: I could not resolve; operator action needed.
#   note:         Optional. Free-form context for low/needs_review entries.

