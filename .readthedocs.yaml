# Read the Docs configuration file
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # Warnings are errors: an unknown fence language, a block that does
  # not lex, or a dead cross-reference must not publish silently. RTD
  # keeps serving the last successful build when this fails.
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
