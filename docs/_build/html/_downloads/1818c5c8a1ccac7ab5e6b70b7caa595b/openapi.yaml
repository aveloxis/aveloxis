    get:
      operationId: augurRepositoryByGroupAndName
      tags: ["Augur catalog"]
      summary: "Returns the repository with this name in the named repository group."
      description: |
        Both names match without regard to letter case (since 0.29.99 the repository name too; it had to match exactly). With the name on two forges the GitHub one is picked, then the lower id. An API token is answered within its owner's groups (since 0.29.99): a group holding none of them is `404`; a repository that exists in the group only outside the scope is the structured `403` naming it.

        Handler: `handleRepoByGroupAndName`.
      security:
        - sessionToken: []
        - apiToken: []
        - {}
      parameters:
        - name: rgName
          in: path
          required: true
          description: The repository group's name (`rg_name`).
          schema:
            type: string
        - name: repoName
          in: path
          required: true
          description: The repository's name (letter case ignored).
